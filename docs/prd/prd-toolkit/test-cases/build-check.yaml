# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, the root of the scratch repository the
#   steps build. "python" is the interpreter running the tests (sys.executable); every run is a subprocess with
#   <tmp> as its working directory. CHECK = <repo>/prd-toolkit/scripts/prd_build_check.py.
#   Every run, and every command of every step, uses the environment the tester-paths paragraph of
#   testing.md, Setup steps gives (Subprocess environment minus GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE,
#   GIT_COMMON_DIR and PRD_PLUGINS_FILE, plus GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM=1), on that
#   paragraph's terms: a relative path in a step is relative to <tmp>; every line a step writes ends in a
#   newline; a step's git command must exit 0, and a step that fails, or does not find the line it is to
#   change, ends the test as an error; "commit <m>" is `git add -A`, then `git commit -q -m <m>`.
#   N0, N0X and TP0 are the steps of testing.md, Setup steps. A line `# @prd T-nnn.n` a step writes is built
#   from parts ("@" + "prd"), as Layout says. `base` in a range is the tag the steps set last.
#   R is the resolved absolute path of <tmp>/docs/prd/orders (os.path.realpath), written with `/`.
#   <h> is what `git log -1 --format=%h -- tests/test_orders.py` prints in <tmp> after the last step, less its
#   newline. HEAD12 is the first 12 characters of what `git rev-parse HEAD` prints after the last step.
#
# Steps of this area:
#   BD1  write docs/prd/orders/notes.txt with the line `a note`; append `y = 2` to src/app.py; commit `edit the PRD folder`
#   BD2  append `y = 2` to src/app.py; commit `edit the code`
#   BD3  BD1; run `git tag -f base`; run `git mv docs/prd/orders/notes.txt notes.txt`; commit `move the note out`
#   BM1  in docs/prd/orders/prd.md, the line `Not applicable: new project.` under `## 8. Adoption map` becomes the
#        three lines `| Area | State | Boundary |`, `|---|---|---|` and `` | import | adopted | `src/**` | ``
#   BV1  write .prd-toolkit/extra.txt with the line `x` and docs/prd/orders/notes.txt with `a note`; commit `edit the copy`
#   BP0  copy <repo>/prd-toolkit to <tmp>/prd-toolkit as plain files (a symlink is followed), leaving out its
#        two top-level folders tests/ and evals/ (a deeper folder of either name is copied) and every .venv, .uv-test-cache and __pycache__ folder; run
#        `python prd-toolkit/scripts/prd_hooks.py vendor docs/prd/orders` (it must exit 0); commit `the plugin`;
#        run `git tag -f base`
#   BP1  append `# a hand edit` to .prd-toolkit/prd_lint.py; write .prd-toolkit/extra.txt with `x`; set the mode
#        of .prd-toolkit/VERSION to 0o755; delete .prd-toolkit/requirements.txt; commit `edit the copy by hand`
#   BP2  append `# a comment` to prd-toolkit/scripts/prd_lint.py; run
#        `python prd-toolkit/scripts/prd_hooks.py vendor docs/prd/orders` (it must exit 0); commit `refresh the copy`
#   BP3  append `# a comment` to prd-toolkit/scripts/prd_lint.py; write .prd-toolkit/extra.txt with `x`;
#        commit `a change without its refresh`
#   BP4  copy prd-toolkit/.claude-plugin/plugin.json to other/.claude-plugin/plugin.json and
#        prd-toolkit/scripts/prd_hooks.py to other/scripts/prd_hooks.py; write .prd-toolkit/extra.txt with `x`;
#        commit `a second plugin`
#   BF1  write tool/.claude-plugin/plugin.json with the line `{"name": "prd-toolkit"}`; write
#        tool/scripts/prd_hooks.py with the three lines `import sys`, `print("vendor broke", file=sys.stderr)`
#        and `sys.exit(1)`; write .prd-toolkit/a.txt with `x`; commit `a broken plugin`
#   BS1  write src/app.py with the three lines `x = 1`, `y = 2` and `z = 3`, in place of its text; commit `sources`
#   BS3  write src/x*.py with the line `a = 1` and src/xy.py with the three lines `b = 1`, `b = 2` and `b = 3`;
#        commit `glob names`
#   BU0  BP0, with the folder name `plügin` (u with diaeresis, U+00FC) in place of `prd-toolkit` in the copy's
#        destination and in the vendor command
#   BU2  append `# a comment` to plügin/scripts/prd_lint.py; run `python plügin/scripts/prd_hooks.py vendor docs/prd/orders`
#        (it must exit 0); commit `refresh the copy`
#   BS2  write src/app.py with the four lines `a = 1`, `b = 2`, `c = 3` and `d = 4`; commit `four lines`; run
#        `git tag -f base`; write src/app.py with the three lines `a = 1`, `b = 2` and `d = 4`; commit `delete line 3`
#   BT1  in docs/prd/orders/test-cases/import.yaml, the line `  input: {content: "K-1,2026-10-01"}` (two spaces
#        before `input:`) becomes `  input: {content: "K-1,2026-10-02"}`; nothing is committed
#   BT2  BT1; commit `change a case`
#   BT3  BT2; append `# rewritten` to tests/test_orders.py; commit `rewrite the test`
#   BT4  BT1; append `# being written` to tests/test_orders.py; nothing is committed
#   BT5  BT1; write tests/test_new.py with the line `# @prd T-001.1`; nothing is committed
#   BT6  write tests/test_more.py with the line `# @prd T-001.1`; commit `another test` with GIT_AUTHOR_DATE and
#        GIT_COMMITTER_DATE set to 2026-01-01T12:00:00+0000 for that commit; append `# later` to
#        tests/test_orders.py; commit `a later test` with both dates set to 2026-01-02T12:00:00+0000; then BT1
#   BT7  write tests/test_extra.py with the line `# @prd T-008.1`; commit `a test before its case`; append the two
#        lines `T-008.1:` and `  ac: AC-007.1` to docs/prd/orders/test-cases/reports.yaml; nothing is committed
#   BT8  in docs/prd/orders/test-cases/import.yaml, the line `T-001.1:` becomes `T-001.9:`; nothing is committed
#   BT9  BT1; in docs/prd/orders/test-cases/import.yaml, the line `  input: {rows: ["K-2"]}` (two spaces before
#        `input:`) becomes `  input: {rows: ["K-9"]}`; nothing is committed

T-186.1:
  ac: AC-186.1
  level: integration
  target: "cli:prd_build_check"
  environment: local
  identity: none
  preconditions: [status-next/base]
  refs: ["testing.md#Setup steps"]
  input:
    setup: [N0]
    cwd: "<tmp>"
    runs:
    - python CHECK
    - python CHECK docs/prd/orders
    - python CHECK docs/prd/orders --diff base..HEAD --stale --tids T-001.1
    - python CHECK docs/prd/orders --results report.md
    - python CHECK docs/prd/orders --stale --tids ""
    - python CHECK docs/prd/orders --results report.md --tids T-001.1 --sources s.txt
    - python CHECK --diff base..HEAD
    note: "no file report.md or s.txt exists, and N0 makes no commit: the refusal comes before any is read"
  expect:
    output:
      each_run:
        exit: 2
        stdout: ""
        stderr_first_line_starts: "usage: prd_build_check.py"
        stderr_last_line: "prd_build_check: give exactly one of --diff, --results (with --tids) or --stale (with --tids); --sources goes with --diff"
    effects: []
    errors: []
    leaks: none

