# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path. N0 is the status-next step (testing.md,
#   Setup steps) that writes fixture status-next/base to <tmp> and runs `git init -q`. A relative path in an edit is
#   inside the PRD folder <tmp>/docs/prd/orders; `src/...` is <tmp>/src/.... Every run is a subprocess,
#   `python CTX <args>`, with <tmp> as its working directory and the environment the status-next steps give.
#   CTX = <repo>/prd-toolkit/scripts/prd_context.py
#   COMMIT = in <tmp>, `git add -A`, then
#     `git -c user.name=Sample -c user.email=sample@example.com -c commit.gpgsign=false commit -q -m base`;
#     <sha> is the output of `git rev-parse --short=7 HEAD` right after it.
#   IMPORTER = src/importer.py with the six lines `def import_file(path):`, `    header = read_header(path)`,
#     `    if header is None:`, `        raise SystemExit(2)`, `` (empty) and `    return header`, each ending in a newline.
#   `<real tmp>` is os.path.realpath(<tmp>).
#   pack_part_titles, pack_part_lines, relations and the stdout_/stderr_ keys are the assertion keys of testing.md
#   (Harness, Assertions).
# Steps of this area (testing.md, Setup steps, the context paragraph):
#   CX0  N0 in <tmp>/<dir> for the folder the case names.
#   CXA  N0; in prd.md the line `Not applicable: new project.` becomes `See adoption.md.`; write adoption.md as the
#        lines `# Adoption map`, ``, `| Area | State | Boundary |`, `|---|---|---|`,
#        ``| import | adopted | `src/importer.py`, `tests/test_orders.py` |`` and `| reports | not started | |`;
#        write features/billing.md as the one line `# Billing`.
#   CXE  N0; in prd.md the line `Not applicable: new project.` becomes `See adoption.md.`; write adoption.md as the
#        lines `# Adoption map`, ``, `| Area | State | Boundary |` and `|---|---|---|`.
#   CXN  N0; append to nfr.md the lines ``, `### NFR-008 Import speed`, `Status: approved`, `Acceptance (EARS):`,
#        `- AC-008.1 The importer shall store a 10,000-row file in under 60 seconds.`, `Errors: -` and
#        `Tests: T-008.1 [integration]  (test-cases/nfr.yaml)`.
#   CXR  CXN; append to features/reports.md the lines ``, `### UJ-01 Read a month's orders` and
#        `Flow: 1. A user asks for a month → 2. the report prints its orders`; in features/import.md insert
#        `Traces: UJ-01, UJ-02` directly after the line `Tests: T-001.1 [integration]  (test-cases/import.yaml)`.
#   CXC  CXN; in prd.md insert ``| cli | `contracts/cli.yaml` | `true` |`` directly after
#        ``| errors | `contracts/errors.yaml` | built-in |``, and `| A-01 | Import files are UTF-8 | open |` directly
#        after the `|---|---|---|` line under `| ID | Assumption | Status |`; write contracts/cli.yaml as the lines
#        `importer:`, `  invocation: python import.py` and `  exit: 2`; in features/import.md the line
#        `Errors: IMPORT_NO_HEADER (contracts/errors.yaml)` becomes
#        `Errors: IMPORT_NO_HEADER, IMPORT_EMPTY, IMPORT_BAD_DATE (contracts/errors.yaml)`, and directly after
#        `Tests: T-001.1 [integration]  (test-cases/import.yaml)` insert `Traces: NFR-008; cli:importer.` and
#        texts.cxc_edge_line (fixture context/texts).
#   CXK  N0; in features/reports.md insert `Target: pack document 1.0.0 (prd-toolkit)` and `` directly after line 2;
#        in prd.md insert ``| outline | `contracts/outline.yaml` | pack |`` directly after
#        ``| errors | `contracts/errors.yaml` | built-in |``; write contracts/outline.yaml as the lines `guide:` and
#        `  title: Install guide`; in test-cases/reports.yaml the first line `  target: code:reports.monthly`
#        (under T-005.1) becomes `  target: doc:guide`.
#   CXS  N0; write IMPORTER; COMMIT; in features/import.md insert `Source: src/importer.py:3 @<sha>` directly after
#        the line `Status: approved` (FR-001's).
#   CXM  N0; write IMPORTER and src/calc.py (the line `total = 0`); COMMIT; insert the line `import os` before line 1
#        of src/importer.py; in features/import.md insert `Source: src/importer.py:3 @<sha>` and
#        `  src/calc.py:1 @<sha>` directly after `Status: approved`.
#   CXT  N0; write IMPORTER and src/twice.py (lines `a = 1`, `b = 2`); COMMIT; line 3 of src/importer.py becomes
#        `    if not header:`; src/twice.py becomes the lines `b = 2`, `a = 1`, `b = 2`; write src/new.py (line
#        `x = 1`); in features/import.md insert directly after `Status: approved` the lines
#        `Source: src/importer.py:3 @<sha>`, `  src/importer.py:9 @<sha>`, `  src/gone.py:1 @<sha>`,
#        `  src/new.py:1 @<sha>`, `  src/importer.py:2 @0000000` and `  src/twice.py:2 @<sha>`.
#   CXB  N0; write src/a.py, src/b.py and src/c.py, each the lines `x = 1`, `` and `y = 2`; COMMIT (<sha>); line 3 of
#        src/c.py becomes `y = 3`; commit again as COMMIT does, with the message `second`; line 3 of src/b.py
#        becomes `y = 4`; in features/import.md insert directly after `Status: approved` the lines
#        `Source: src/a.py:2 @<sha>`, `  src/b.py:2 @<sha>` and `  src/c.py:2 @<sha>`.
#   CXP  N0; write IMPORTER; COMMIT; line 3 of src/importer.py becomes `    if not header:`; in features/import.md
#        insert before line 3 (`### FR-001 Refuse a file with no header`) the lines `### UJ-01 Import a file`,
#        `Source: src/importer.py:3 @<sha>` and ``, and directly after
#        `Tests: T-001.1 [integration]  (test-cases/import.yaml)` the line `Traces: UJ-01`.
#   CXO  CXP; then in features/import.md insert directly after FR-001's `Status: approved` the lines
#        `Source: src/importer.py:3 @<sha>` and `  src/importer.py:3 @<sha>`.
#   CXL  N0; write links.md as the lines `# Links`, ``, `## Upstreams`, ``,
#        `| Upstream | Location | Version | Commit | Needs |`, `|---|---|---|---|---|` and
#        ``| greet | `../greet` | | | |``; in features/import.md insert `Traces: op:greet/hello` directly after
#        `Tests: T-001.1 [integration]  (test-cases/import.yaml)`.

