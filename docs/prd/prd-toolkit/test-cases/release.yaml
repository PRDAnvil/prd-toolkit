# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root, an absolute path; <tmp> is the test's own tmp_path.
#   A file is read from the checkout at <repo> as UTF-8; JSON is parsed with json.loads, TOML with tomllib.
#   MARKET = <repo>/.claude-plugin/marketplace.json parsed; ENTRY = the one element of MARKET["plugins"].
#   PLUGIN = <repo>/prd-toolkit/.claude-plugin/plugin.json parsed. <v> = PLUGIN["version"].
#   PREADME = <repo>/prd-toolkit/README.md; RREADME = <repo>/README.md.
#   "intro" of a README = its text before the first line that starts with "## ".
#   "section <T>" of a README = the lines from the first line that equals "## <T>" once its line ending is
#   removed, that line included, up to and not including the next line that starts with "## ", or to the
#   end of the file when no later "## " line follows.
#   A fenced block = the lines between an opening fence and its closing fence, a fence being a line whose
#   text, with its leading white space removed, starts with three backticks; fences pair in file order,
#   the first opening a block and the second closing it, the third opening the next, and so on, so the
#   lines between one block's closing fence and the next opening fence are no block; fences pair over
#   the whole file, and a block belongs to a section only when both its fences lie inside that section;
#   a block's lines are compared with their leading and trailing white space removed.
#   The testing.md paragraph on the release cases says how <repo> is found and what each expect.output key means.
#   "flat" = every run of white space replaced by one space.
#   These cases run nothing but file reads, except T-272.1 (prd_lint.py), T-274.x (sh and git init)
#   and T-276.1 (git ls-files).

