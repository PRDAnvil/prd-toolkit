T-274.1:
  ac: AC-274.1
  level: integration
  refs: ["testing.md#Harness"]
  target: "code:README.md"
  environment: local
  identity: none
  preconditions: []
  input:
    setup:
    - "FUNC = the lines of RREADME from the first line that equals `prd() {` once its line ending is removed to the next line that equals `}` once its line ending is removed, both included, joined with newlines"
    - "write <tmp>/home/.claude/plugins/cache/prdanvil/prd-toolkit/0.8.9/scripts/prd: printf '%s\\n' plugin-0.8.9 \"$@\""
    - "write <tmp>/home/.claude/plugins/cache/prdanvil/prd-toolkit/0.8.19/scripts/prd: printf '%s\\n' plugin-0.8.19 \"$@\""
    - "git init <tmp>/repo; write <tmp>/repo/.prd-toolkit/prd: printf '%s\\n' vendored \"$@\""
    env:
      HOME: "<tmp>/home"
      GIT_CEILING_DIRECTORIES: "<tmp>"
      note: "the Subprocess environment (testing.md Harness) minus GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE and GIT_COMMON_DIR"
    cwd: "<tmp>/repo"
    command: ["sh", "-c", "FUNC\nprd \"$@\"", "sh", "lint", "docs/prd/a b"]
  expect:
    output:
      exit: 0
      stdout_exact: "vendored\nlint\ndocs/prd/a b\n"
      stderr: ""
    effects:
    - "no file under <tmp> changes"
    errors: []
    leaks: none

T-274.2:
  ac: AC-274.2
  level: integration
  refs: ["testing.md#Harness"]
  target: "code:README.md"
  environment: local
  identity: none
  preconditions: []
  input:
    setup:
    - "the setup of T-274.1"
    - "git init <tmp>/novendor (no .prd-toolkit/ in it)"
    - "mkdir <tmp>/plain (in no git working tree; GIT_CEILING_DIRECTORIES stops the search at <tmp>)"
    env:
      HOME: "<tmp>/home"
      GIT_CEILING_DIRECTORIES: "<tmp>"
      note: "as T-274.1"
    runs:
    - {cwd: "<tmp>/repo", command: ["sh", "-c", "FUNC\nprd \"$@\"", "sh", "publish", "docs/prd/a"]}
    - {cwd: "<tmp>/plain", command: ["sh", "-c", "FUNC\nprd \"$@\"", "sh", "status"]}
    - {cwd: "<tmp>/novendor", command: ["sh", "-c", "FUNC\nprd \"$@\"", "sh", "lint"]}
  expect:
    output:
      run_1: {exit: 0, stdout_exact: "plugin-0.8.19\npublish\ndocs/prd/a\n"}
      run_2: {exit: 0, stdout_exact: "plugin-0.8.19\nstatus\n"}
      run_3: {exit: 0, stdout_exact: "plugin-0.8.19\nlint\n"}
    effects:
    - "no file under <tmp> changes"
    errors: []
    leaks: none

