T-071.4:
  ac: AC-071.2
  level: integration
  target: "cli:prd_gates"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - IC0
    cwd: "<tmp>/main"
    call: "before the call the test keeps the text of <tmp>/wt/docs/prd/orders/errors.md and the commit `git rev-parse main` and `git rev-parse other` print in <tmp>/main; then, with one server = prdlint.gates.make_inbox(<tmp>/main/docs/prd/orders)[0]: L1 = server.state.listing(); card = the card of L1[\"worktrees\"][0] whose id is error-class:E-001; (status, result) = server.state.answer({\"worktree\": MAIN, \"gate\": \"error-class:E-001\", \"question\": card[\"question\"], \"choice\": \"confirm\", \"words\": \"\"}), the request POST /answer serves (contracts/cli.yaml prd_gates.inbox_answer); L2 = server.state.listing(); then server.server_close(); the return is {status: status, exit: result[\"result\"][\"exit\"], before: GROUPS(L1), after: GROUPS(L2)}"
    note: "the owner confirms the class from main's card; wt's entry stays proposed in wt's checkout"
  expect:
    output:
      return:
        status: 200
        exit: 0
        before:
        - {path: MAIN, branch: main, ids: ["error-class:E-001"]}
        - {path: WT, branch: other, ids: []}
        after:
        - {path: MAIN, branch: main, ids: []}
        - {path: WT, branch: other, ids: []}
    effects:
    - "in <tmp>/main, `git rev-list --count <the commit main named before>..main` prints 1, and `git log -1 --format=%s main` prints `docs(prd): confirm E-001`"
    - "in <tmp>/main, `git rev-parse other` prints the commit it printed before the call"
    - "<tmp>/wt/docs/prd/orders/errors.md is byte-identical to its text before the call, and `git status --porcelain` in <tmp>/wt prints nothing"
    errors: []
    leaks: none

T-071.5:
  ac: AC-071.3
  level: integration
  target: "cli:prd_gates"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - IC0
    cwd: "<tmp>/wt"
    command: python GATES list docs/prd/orders
    note: "main holds the same E-001, so the inbox would leave wt's card out; list reads wt's PRD folder alone"
  expect:
    output:
      exit: 0
      stdout: "error-class:E-001 The importer stops at row 1000\n"
      stderr: ""
    effects: []
    errors: []
    leaks: none
