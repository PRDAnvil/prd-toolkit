        - {path: WT, branch: other, ids: []}
    effects:
    - "in <tmp>/main, `git rev-list --count <the commit main named before>..main` prints 1, and `git log -1 --format=%s main` prints `docs(prd): confirm E-001`"
    - "in <tmp>/main, `git rev-parse other` prints the commit it printed before the call"
    - "<tmp>/wt/docs/prd/orders/errors.md is byte-identical to its text before the call, and `git status --porcelain` in <tmp>/wt prints nothing"
    errors: []
    leaks: none

