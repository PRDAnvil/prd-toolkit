    cwd: "<tmp>/main"
    call: "G = GROUPS(LISTING(<tmp>/main/docs/prd/orders)); the return is {count: len(G), first: G[0], later_ids: [g[\"ids\"] for g in G[1:]], later_paths: sorted(g[\"path\"] for g in G[1:])}"
    note: "E-001 is proposed in all three worktrees, but its title differs in wt (ICT) and its Detected: line in wt2 (ICD): three different entries"
  expect:
    output:
      return:
        count: 3
        first: {path: MAIN, branch: main, ids: ["error-class:E-001"]}
        later_ids: [["error-class:E-001"], ["error-class:E-001"]]
        later_paths: [WT, WT2]
    effects: []
    errors: []
