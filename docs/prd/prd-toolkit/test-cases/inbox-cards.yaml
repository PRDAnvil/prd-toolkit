# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path. Step IC0 (testing.md, Setup steps) builds the
#   repository <tmp>/main from fixture status-next/base with E-001 `proposed` (status-next/files errors_proposed:
#   heading `### E-001 The importer stops at row 1000`, `Detected: 2026-11-03, a run on the October file`),
#   commits it on the branch main, and adds the worktree <tmp>/wt on the branch other; step IC2 adds <tmp>/wt2 on
#   the branch third. MAIN, WT and WT2 are str(pathlib.Path(<tmp>/main).resolve()), and the same of <tmp>/wt and
#   <tmp>/wt2: the paths the inbox gives its groups.
#   LISTING(P) is the inbox listing of the PRD folder P, a pathlib.Path, read in the test process with
#   prd-toolkit/scripts on sys.path: `server, token = prdlint.gates.make_inbox(P)`, then `server.state.listing()`,
#   the dict GET /gates serves (contracts/cli.yaml prd_gates.listing), then `server.server_close()`, which runs
#   even when the listing raises (a `finally`), so that the inbox's lock file is released. GROUPS(L) is, for a listing L, the list
#   with one mapping per entry of L["worktrees"], in order: {path: <its path>, branch: <its branch>, ids: <the id
#   of each of its gates, in order>}.
#   "python" is the interpreter running the tests (sys.executable); a CLI run is a subprocess with the environment
#   the inbox-cards steps give.
#   GATES = <repo>/prd-toolkit/scripts/prd_gates.py
#   A case's `call:` runs with the case's `cwd` as the test process's working directory (monkeypatch.chdir, once the
#   setup has made it). In an effect, "`<git command>` prints X" means the command's whole stdout is X followed by
#   one newline, and "prints nothing" that its stdout is empty.
#   The T-071 cases are E-023's: an error-class card showed once per worktree, and each answer was committed on each
#   branch. The T-254 cases are FR-254's: the card's explanation and the question answer. A case's `runs:` are
#   run in order, each as `command:` is, and `run_<n>` names the n-th. LOG is <tmp>/main/.git/prd-gates-log.jsonl,
#   the answer log of the repository's git common folder; its LAST line is its last line parsed as JSON. Before
#   the call or the first run of a T-254 case, the test keeps the text of <tmp>/main/docs/prd/orders/errors.md,
#   the commit `git rev-parse HEAD` prints in <tmp>/main and the number of lines of LOG (0 when it does not
#   exist); "as before" in an effect compares with those.

T-071.1:
  ac: AC-071.1
  level: integration
  target: "cli:prd_gates"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - IC0
    cwd: "<tmp>/main"
    call: "L1 = LISTING(<tmp>/main/docs/prd/orders), then L2 = LISTING(<tmp>/wt/docs/prd/orders); the return is {first: GROUPS(L1), second: GROUPS(L2)}"
    note: "E-001 is proposed, with the same heading and Detected: line, in both worktrees: the inbox started from main, then the one started from wt"
  expect:
    output:
      return:
        first:
        - {path: MAIN, branch: main, ids: ["error-class:E-001"]}
        - {path: WT, branch: other, ids: []}
        second:
        - {path: WT, branch: other, ids: ["error-class:E-001"]}
        - {path: MAIN, branch: main, ids: []}
    effects: []
    errors: []
    leaks: none

T-071.2:
  ac: AC-071.1
  level: integration
  target: "cli:prd_gates"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - IC0
    - IC2
    - ICN
    cwd: "<tmp>/main"
    call: "G = GROUPS(LISTING(<tmp>/main/docs/prd/orders)); the return is {count: len(G), first: G[0], later_ids: [g[\"ids\"] for g in G[1:]], later_paths: sorted(g[\"path\"] for g in G[1:])}"
    note: "main's errors.md holds no entry (ICN, uncommitted); wt and wt2 both hold E-001, proposed; git gives the order of wt and wt2, so the case names the second group by its place, not its path"
  expect:
    output:
      return:
        count: 3
        first: {path: MAIN, branch: main, ids: []}
        later_ids: [["error-class:E-001"], []]
        later_paths: [WT, WT2]
    effects: []
    errors: []
    leaks: none

