T-254.1:
  ac: AC-254.1
  level: integration
  target: "code:prdlint.gates.card"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - IC0
    - ICE
    cwd: "<tmp>/main"
    call: "for P in (<tmp>/main, <tmp>/wt), each a pathlib.Path: prd = prdlint.model.load(P / \"docs/prd/orders\"); gate = the Gate of prdlint.gates.list_gates(prd, P) whose id is error-class:E-001; card = prdlint.gates.card(gate, prd, P, \"docs/prd/orders\"); the return is {main: {keys: list(card), choices: card[\"choices\"], explanation: card[\"explanation\"]}, wt: {keys: list(card), explanation: card[\"explanation\"]}}, each from its own P"
    note: "ICE gives main's E-001 an Explanation: line, uncommitted; wt's E-001 has none"
  expect:
    output:
      return:
        main:
          keys: [id, kind, title, question, evidence, choices, source, areas, url, class, diagnosis, explanation, waiting]
          choices: [confirm, correct, question]
          explanation: "An import of a file of 1,200 rows stored 1,000 of them."
        wt:
          keys: [id, kind, title, question, evidence, choices, source, areas, url, class, diagnosis, explanation, waiting]
          explanation: null
    effects: []
    errors: []
    leaks: none

