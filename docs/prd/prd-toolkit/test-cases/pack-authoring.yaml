# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path. Step K0 (testing.md, Setup steps) writes
#   fixture pack-authoring/sites there: two scratch repositories, <tmp>/north holding the PRD folder
#   docs/prd/north and <tmp>/south holding docs/prd/south, each committed, and the plugin folder <tmp>/plug whose
#   pack is <tmp>/plug/prd-packs/leaflet; and it sets PRD_PLUGINS_FILE for every run of the case.
#   "python" is the interpreter running the tests (sys.executable); a CLI case runs the script as a subprocess
#   (testing.md Harness, Lifecycle), with the Subprocess environment minus the git variables Setup steps names.
#   PACK     = <repo>/prd-toolkit/scripts/prd_pack.py
#   CHANGE   = <repo>/prd-toolkit/scripts/prd_change.py
#   LINT     = <repo>/prd-toolkit/scripts/prd_lint.py
#   CONTEXT  = <repo>/prd-toolkit/scripts/prd_context.py
#   DISPATCH = <repo>/prd-toolkit/scripts/prd_dispatch.py
#   VPACK    = <tmp>/.prd-toolkit/prd_pack.py, the vendored copy step KVC loads
#   A case runs from <tmp> unless it gives another cwd. "A" is north and "B" is south: compare and check name
#   north's folder first. The setup steps run in the order a case lists them; a note that names a step run
#   between two runs means the test runs it there.
#   `pack_part_titles` and `pack_part_lines` are the assertion keys testing.md defines (Harness, Assertions).

T-057.1:
  ac: AC-057.1
  level: integration
  target: "cli:prd_pack"
  environment: local
  identity: none
  preconditions:
  - pack-authoring/sites
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - K0
    cwd: "<tmp>"
    command: python PACK compare north/docs/prd/north south/docs/prd/south
    note: "the whole stdout; T-057.2 to T-057.8 give each part's lines as the criteria form them"
  expect:
    output:
      exit: 0
      stderr: ""
      pack_part_titles:
      - "## Contract types"
      - "## Target kinds"
      - "## Levels"
      - "## Harness"
      - "## Standards"
      - "## Skills"
      - "## Vocabulary"
      stdout_exact_lines:
      - "## Contract types"
      - "both pages: contracts/pages.yaml; python3 -c \"import sys; sys.exit(any(not open(f).readline().rstrip().endswith(chr(58)) for f in sys.argv[1:]))\""
      - "both routes: contracts/routes.yaml; python3 -c \"import sys; sys.exit(any(len(open(f).readlines()) < 2 for f in sys.argv[1:]))\""
      - "A forms: contracts/forms.yaml; python3 -c \"import sys; sys.exit(any(len(open(f).readlines()) < 1 for f in sys.argv[1:]))\""
      - "B feeds: contracts/feeds.yaml; python3 -c \"import sys; sys.exit(any(len(open(f).readlines()) < 3 for f in sys.argv[1:]))\""
      - ""
      - "## Target kinds"
      - "both pages: 2 in A, 1 in B"
      - "both routes: 1 in A, 1 in B"
      - "A forms: 1 in A, 0 in B"
      - "B feeds: 0 in A, 1 in B"
      - ""
      - "## Levels"
      - "both unit: python3 -m pytest tests/unit; environment local; gate build; timeout -"
      - "A integration: python3 -m pytest tests/integration; environment local; gate build; timeout -"
      - "B integration: python3 -m pytest tests/site; environment local; gate build; timeout -"
      - ""
      - "## Harness"
      - "both Lifecycle: Nothing runs between tests; each test serves the site folder itself."
      - "both Environment switch: Not applicable: one test environment, `local`."
      - "both Database access: Not applicable: no database."
      - "A Tools on the runner: python3 on PATH; `tests/` sits at the repository root."
      - "B Tools on the runner: python3 and a headless browser on PATH; `tests/` sits at the repository root."
      - "both Clean state: Every test starts from its own temporary directory."
      - "both Persistent environments: Not applicable: no test environment keeps data."
      - "both Layout: `tests/<level>/test_<area>.py`; each test's docstring cites its T-id. Test roots: `tests/`"
      - "both HTTP requests: Each test requests a path of the site it serves."
      - "both Fixtures: Not applicable: the cases give their input inline."
      - "both Browser identity: Not applicable: no sign-in."
      - "both Assertions: Fields a case does not list are not asserted."
      - "both Waits: Not applicable: every request completes before the test asserts."
      - "both Effects: Not applicable: the cases assert responses only."
      - "both Leaks: Not applicable: no classified data."
      - "both Acceptance: Not applicable: no acceptance level."
      - ""
      - "## Standards"
      - "both site/**/*.html: python3 tools/check_html.py"
      - ""
      - "## Skills"
      - "both a change to a page: code-review"
      - ""
      - "## Vocabulary"
      - "both page: 6 in A, 5 in B"
      - "both visitor: 5 in A, 4 in B"
      - "both site: 4 in A, 4 in B"
      - "both address: 3 in A, 3 in B"
      - "both opens: 3 in A, 3 in B"
      - "both path: 3 in A, 3 in B"
      - "both answer: 2 in A, 2 in B"
      - "both redirect: 2 in A, 2 in B"
      - "both with: 2 in A, 2 in B"
      - "both each: 1 in A, 2 in B"
      - "both error: 1 in A, 1 in B"
      - "both file: 1 in A, 1 in B"
      - "both holds: 1 in A, 1 in B"
      - "both missing: 1 in A, 1 in B"
      - "both serve: 1 in A, 1 in B"
      - "both that: 1 in A, 1 in B"
      - ""
    effects: []
    errors: []
    leaks: none

