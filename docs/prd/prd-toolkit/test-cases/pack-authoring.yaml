T-058.1:
  ac: AC-058.1
  level: integration
  target: "cli:prd_pack"
  environment: local
  identity: none
  preconditions:
  - pack-authoring/sites
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - K0
    cwd: "<tmp>"
    command: python PACK compare --json north/docs/prd/north south/docs/prd/south
    note: "a value the text writes as `-` (the Timeout here) is null"
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_json_keys_at:
        ? ""
        : - interface
          - kind
          - a
          - b
          - parts
        parts:
        - contract-types
        - target-kinds
        - levels
        - harness
        - standards
        - skills
        - vocabulary
        parts.contract-types.0:
        - mark
        - type
        - files
        - validator
        parts.target-kinds.0:
        - mark
        - type
        - a
        - b
        parts.levels.0:
        - mark
        - level
        - command
        - environment
        - gate
        - timeout
        parts.harness.0:
        - mark
        - slot
        - text
        parts.standards.0:
        - mark
        - glob
        - linter
        parts.skills.0:
        - mark
        - activity
        - skill
        parts.vocabulary.0:
        - mark
        - word
        - a
        - b
      stdout_json_at:
        interface: 1
        kind: pack.compare
        a: north/docs/prd/north
        b: south/docs/prd/south
        parts.contract-types.2.mark: A
        parts.contract-types.2.type: forms
        parts.contract-types.2.files: contracts/forms.yaml
        parts.target-kinds.0:
          mark: both
          type: pages
          a: 2
          b: 1
        parts.target-kinds.3:
          mark: B
          type: feeds
          a: 0
          b: 1
        parts.levels.0:
          mark: both
          level: unit
          command: python3 -m pytest tests/unit
          environment: local
          gate: build
          timeout: null
        parts.levels.2:
          mark: B
          level: integration
          command: python3 -m pytest tests/site
          environment: local
          gate: build
          timeout: null
        parts.harness.4:
          mark: B
          slot: Tools on the runner
          text: "python3 and a headless browser on PATH; `tests/` sits at the repository root."
        parts.standards:
        - mark: both
          glob: "site/**/*.html"
          linter: python3 tools/check_html.py
        parts.skills:
        - mark: both
          activity: a change to a page
          skill: code-review
        parts.vocabulary.0:
          mark: both
          word: page
          a: 6
          b: 5
      relations:
      - "each list of `parts` has one entry per line of the matching part of the stdout of `python PACK compare north/docs/prd/north south/docs/prd/south` run in the same state (T-057.1), in the same order, and an entry's values are the ones that line prints"
    effects: []
    errors: []
    leaks: none

