    errors: []
    leaks: none

T-068.7:
  ac: AC-068.5
  level: integration
  target: "cli:prd_hooks"
  environment: local
  identity: none
  preconditions:
  - status-next/empty
  - standards-run/texts
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - SR0
    cwd: "<tmp>"
    runs:
    - python HOOKS ci --github docs/prd/orders
    - python HOOKS check --ci docs/prd/orders
    - python HOOKS check --ci docs/prd/orders
    note: "between run_2 and run_3 the test runs step SO, which gives the file the job line a release before this area wrote (texts.old_job_line); run_2 and run_3 also report the scratch repository's missing managed blocks, which this case does not assert"
  expect:
    output:
      run_1:
        exit: 0
      run_2:
        stdout_not_contains: .github/workflows/prd-toolkit.yml
      run_3:
        exit: 1
        stdout_contains_line: "stale: .github/workflows/prd-toolkit.yml: re-run prd_hooks.py ci --github --force"
    effects: []
    errors: []
    leaks: none

# The FR-264 cases (E-074): a row's files mode, the second backticked span of its Linter command cell.

T-264.1:
  ac: AC-264.2
  level: integration
  target: "cli:prd_hooks"
  environment: local
  identity: none
  preconditions:
  - status-next/empty
  - standards-run/texts
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - SR0
    - SM1
    - SG5
    cwd: "<tmp>"
    runs:
    - python HOOKS ci --github docs/prd/orders
    - sh -c JOB
    note: "JOB is texts.none_job_line, passed to sh as one argument; SG5 stages every file, so tracked Python files match the glob"
  expect:
    output:
      run_1:
        exit: 0
        stdout: "wrote .github/workflows/prd-toolkit.yml\n"
        stderr: ""
      run_2:
        exit: 0
    effects:
    - "<tmp>/.github/workflows/prd-toolkit.yml, read with yaml.safe_load, holds at `jobs.standards-1.steps.2.run` the string texts.none_job_line"
    - "after run_2, <tmp>/lint.log holds exactly one line, and it is empty: the linter ran once, given no path"
    errors: []
    leaks: none

