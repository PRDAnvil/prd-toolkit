T-068.5:
  ac: AC-068.4
  level: integration
  target: "cli:prd_hooks"
  environment: local
  identity: none
  preconditions:
  - status-next/empty
  - standards-run/texts
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - SR0
    - SG5
    cwd: "<tmp>"
    runs:
    - python HOOKS ci --github docs/prd/orders
    - sh -c JOB
    note: "JOB is texts.job_line, passed to sh as one argument; SG5 deletes src/bad.py and .prd-toolkit-notes.py and stages every file, so the job lists the tracked files"
  expect:
    output:
      run_1:
        exit: 0
        stdout: "wrote .github/workflows/prd-toolkit.yml\n"
        stderr: ""
      relations:
      - "run_2's exit code is not 0 (the linter refuses src/.prd-toolkit/x.py; xargs reports that with its own code)"
    effects:
    - "<tmp>/.github/workflows/prd-toolkit.yml, read with yaml.safe_load, holds at `jobs.standards-1.steps.2.run` the string texts.job_line"
    - "after run_2, <tmp>/lint.log holds exactly the one line `./src/.prd-toolkit/x.py ./src/ok.py ./tests/test_orders.py`: no path under .prd-toolkit/"
    errors: []
    leaks: none

