# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, the root of the scratch repository the steps
#   build from fixture status-next/base (testing.md, Setup steps), unless a step names another folder; RTMP is
#   <tmp> resolved with its symbolic links followed (Path.resolve()), written wherever a run prints an absolute
#   path; ORDERS = <tmp>/docs/prd/orders, and a relative path in a step is inside <tmp> unless the step says it
#   is inside ORDERS. "python" is the interpreter running the tests (sys.executable).
#   TRD = <repo>/prd-toolkit/scripts/prd_trd.py.
#   A run's text becomes its argument list this way: TRD and <tmp> are replaced by their values, the text is
#   split into words with Python's shlex.split (quotes group words and are removed, nothing is expanded; the
#   tests assume a repository path and a temporary folder that hold no white space and no quote character), and
#   a first word `python` becomes the interpreter running the tests; the words are run with no shell, with <tmp>
#   as the working directory, as a subprocess. `run_<n>` names the n-th run of a case and `each_run` every run;
#   <today> is as testing.md (Harness, Assertions) defines it.
#   Every run, every command of a step and the test's own git commands use the Subprocess environment (Harness)
#   minus GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE, GIT_COMMON_DIR and PRD_PLUGINS_FILE, plus
#   GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM=1, which the test sets in its own process, through pytest's
#   monkeypatch, before its first step, so that the `git init` of steps N0 and N0X inherits them too. A step's
#   command must exit 0, and a step that does not find the line it changes ends the test as an error, not a
#   failure. Every line a step writes ends in a newline. A step that commits runs, in the repository's root,
#   `git add -A` and then `git commit -q -m <message>`.
#   Steps run in the order a case lists them. N0 and N0X are the status-next steps; the steps below are this
#   file's own.
#     V0  N0; then run `git config user.name Sample`, `git config user.email sample@example.com`,
#         `git config commit.gpgsign false` and `git config core.hooksPath /dev/null`; commit `base`
#     VA  in ORDERS/prd.md the line `Not applicable: new project.` under `## 8. Adoption map` becomes
#         `See adoption.md.`; write ORDERS/adoption.md with the seven lines `# Adoption map`, ``,
#         `| Area | State | Boundary |`, `|---|---|---|`, ``| import | adopted | `src/importer.py`, `src/lib/**` |``,
#         ``| reports | not started | `src/reports.py` |`` and ``| billing | not started | `src/billing/*.py` |``;
#         write each of `src/importer.py`, `src/lib/a.py`, `src/lib/sub/b.py`, `src/reports.py`,
#         `src/billing/pay.py`, `src/billing/deep/x.py`, `notes/readme.md`, `.prd-toolkit/x.py` and
#         `.prd-toolkit-notes.md` with the one line `x = 1`; commit `map`. No `features/billing.md` is written
#     VS  in ORDERS/features/import.md insert directly after the line `Status: built` the line
#         `Source: src/importer.py:1 @abc1234`, after the line `Status: verified` the line
#         `Source: src/gone.py:4 @abc1234`, and after the line `Status: live (since 1.0.0)` the line
#         `Source: src/importer.py:5 @abc1234`; commit `sources`. `src/importer.py` holds one line and HEAD holds
#         no `src/gone.py`
#     VW  write `src/untracked.py` with the one line `x = 1`; nothing is committed
#     VO  write `view.md` with the one line `old text`; nothing is committed
#     VL  create the symbolic link `link` whose target is the absolute path of ORDERS
#     VE  create the empty folder `<tmp>/empty`
#     VX  N0X with `<tmp>/nogit` as its folder: the orders PRD folder in no git work tree
#     VN  N0 with `<tmp>/nocommit` as its folder: a repository with no commit
#     VR  V0 with `<tmp>/repo` as its folder in place of <tmp>
#   <sha7> is the first 7 characters of what `git rev-parse HEAD` prints in <tmp> after the case's last step.
#   GEN is the line ``Generated by prd trd from `docs/prd/orders` at <sha7>. Do not edit it: run prd trd again. The PRD is the authority, and the black-box tester never reads this file.``
#   `pack_part_titles`, `pack_part_lines`, `relations` and the stdout and stderr keys are the assertion keys
#   testing.md defines (Harness, Assertions); `pack_part_lines` holds the `## <section>` line itself.

T-265.1:
  ac: AC-265.1
  level: integration
  target: "cli:prd_trd"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  refs:
  - "testing.md#Setup steps"
  input:
    setup: [V0]
    command: "python TRD docs/prd/orders"
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_first_line: "# Technical view: orders 1.0.0"
      pack_part_titles:
      - "## Stack"
      - "## Architecture"
      - "## Components"
      - "## Requirements to code"
      - "## Standards"
      - "## Skills"
      - "## Contracts"
      - "## Uncovered code"
      relations:
      - "stdout's second line is empty and its third line is GEN"
      - "every `## ` line of stdout is directly preceded by an empty line and directly followed by an empty line, and the line after that empty line starts with `From: `"
      - "stdout ends with a newline, and its last line is not empty"
    effects: []
    errors: []
    leaks: none

