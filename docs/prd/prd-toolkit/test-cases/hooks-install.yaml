  level: integration
  target: "cli:prd_hooks"
  environment: local
  identity: none
  preconditions: [status-next/empty]
  refs: ["testing.md#Setup steps"]
  input:
    setup:
    - N0E
    - "write <tmp>/.git/hooks/pre-commit with the text \"#!/bin/sh\\necho mine\\n\""
    cwd: "<tmp>"
    command: python HOOKS install docs/prd/orders
  expect:
    output:
      exit: 0
      stdout_lines_in_this_relative_order:
      - "installed .git/hooks/commit-msg"
      - '.git/hooks/pre-commit already exists and was left alone; add this line to .git/hooks/pre-commit (an sh hook; place it before any `exit 0` in it): prd_top="$(git rev-parse --show-toplevel)" || exit 1; if [ -f "$prd_top/.prd-toolkit/prd_git_hook.py" ] && [ ! -f "$prd_top/.prd-toolkit/prd" ]; then echo "prd-toolkit: .prd-toolkit/ on this branch predates 0.8.8 (no .prd-toolkit/prd); hook skipped" >&2; elif [ -f "$prd_top/.prd-toolkit/prd_git_hook.py" ] && [ -f "$prd_top/.prd-toolkit/prd" ] && [ -d "$prd_top/docs/prd/orders" ]; then command -v uv >/dev/null 2>&1 || { echo "prd-toolkit: uv is not on PATH; install uv to run this hook" >&2; exit 1; }; sh "$prd_top/.prd-toolkit/prd" git-hook pre-commit "$prd_top/docs/prd/orders" "$@" || exit $?; else echo "prd-toolkit: no .prd-toolkit/ (or no PRD folder) on this branch; hook skipped" >&2; fi'
      stdout_not_contains: "installed .git/hooks/pre-commit"
    effects:
    - "<tmp>/.git/hooks/pre-commit is \"#!/bin/sh\\necho mine\\n\", unchanged"
    errors: []
    leaks: none

