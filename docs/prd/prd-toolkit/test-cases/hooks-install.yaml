# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root, and <tmp> is the test's own tmp_path. Each scratch repository is built by step N0E
#   (testing.md, Setup steps) from fixture status-next/empty, whose PRD folder is docs/prd/orders. "N0E in <tmp>/a"
#   builds it in that folder.
#   "python" is the interpreter running the tests (sys.executable). Every run is a subprocess with the environment the
#   Setup steps give, plus GIT_CONFIG_GLOBAL=<tmp>/gitconfig-empty (an empty file the test writes) and
#   GIT_CONFIG_NOSYSTEM=1, so no core.hooksPath comes from outside the scratch repository.
#   HOOKS    = <repo>/prd-toolkit/scripts/prd_hooks.py          (the plugin's)
#   VHOOKS   = <tmp>/.prd-toolkit/prd_hooks.py                  (the vendored copy, after VENDOR)
#   DISPATCH = <repo>/prd-toolkit/scripts/prd_dispatch.py
#   VENDOR   = copy fixture repo/vendored to <tmp>/.prd-toolkit, as its Load column says
#   V        = the "version" of <repo>/prd-toolkit/.claude-plugin/plugin.json
#   SHIM(h, p) = the text of <repo>/prd-toolkit/templates/hooks/<h>, read as UTF-8 with LF line ends, with every {{hook}} replaced by <h> and every
#                {{prd}} by <p>
#   LINE(h)  = the hook line of FR-102 for hook <h> and docs/prd/orders, written out in T-102.1 for pre-commit
#   DEPLOY   = after N0E: write docs/prd/orders/operations.md as DEPLOY_OPS below; in docs/prd/orders/testing.md,
#              insert the line "| system | `pytest tests/system` | local | deploy |" directly after the line
#              "| integration | `pytest tests/integration` | local | build |"
#   DEPLOY_OPS = "# Operations\n\n## Environments\n\n| Environment | URL | Production |\n|---|---|---|\n
#              | staging | https://staging.example.com | no |\n| production | https://example.com | yes |\n\n
#              ## Runbook\n\n1. System tests on staging (actor: agent) (env: staging)\n   Run: tests system\n
#              2. Approve production (actor: human) (env: production)\n   Do: reply \"deploy production\"\n
#              Check: the reply says \"deploy production\"\n\n## Drift\n\n
#              | Environment | Check | Introspection command |\n|---|---|---|\n
#              | production | version | `./app --prd-version` |\n\n## Secrets\n\n- DEPLOY_TOKEN: the deploy key\n"
#              (each wrapped line continues the string; the "Do:" and "Check:" lines are indented three spaces)
#   GH(id, cmds) = the GitHub job lines "  <id>:", "    runs-on: ubuntu-latest", "    steps:",
#              "      - uses: actions/checkout@v4", "        with:", "          fetch-depth: 0",
#              "      - uses: astral-sh/setup-uv@v5", then "      - run: <json.dumps(cmd)>" per command, then ""
#   GL(id, cmds) = the GitLab job lines "<id>:", "  image: python:3.12", "  rules:",
#              "    - if: '$CI_PIPELINE_SOURCE == \"merge_request_event\"'", "  before_script:",
#              "    - \"pip install uv\"", "  script:", then "    - <json.dumps(cmd)>" per command, then ""
#   A file "lines" list is compared to str.splitlines() of the file's text, which must also end in exactly one "\n".

T-097.1:
  ac: AC-097.1
  level: integration
  target: "cli:prd_hooks"
  environment: local
  identity: none
  preconditions: [status-next/empty]
  refs: ["testing.md#Setup steps"]
  input:
    setup: [N0E]
    cwd: "<tmp>"
    runs:
    - python HOOKS ci --gitlab --github docs/prd/orders
    - python HOOKS ci docs/prd/orders
  expect:
    output:
      each_run:
        exit: 2
        stdout: ""
        stderr: "prd_hooks: ci needs exactly one of --gitlab or --github\n"
    effects:
    - "after both runs, <tmp>/.github and <tmp>/.gitlab do not exist"
    errors: []
    leaks: none

