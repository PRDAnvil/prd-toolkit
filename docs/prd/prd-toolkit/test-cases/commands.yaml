# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root, found as in the testing.md paragraph on the release cases.
#   A file is read from the checkout at <repo> as UTF-8.
#   NAMES = prd-adopt, prd-build, prd-change-set, prd-change, prd-context, prd-deploy, prd-error, prd-new,
#   prd-pack, prd-practices, prd-publish, prd-status.
#   CMD(<name>) = the text of <repo>/prd-toolkit/commands/<name>.md.
#   FM(<name>) = the lines of CMD(<name>) after its first line, up to and not including the next line that is `---`.
#   BODY(<name>) = the text of CMD(<name>) after that closing `---` line.
#   STEP(<name>, <n>) = the lines of BODY(<name>) from the first line that starts with "<n>. " up to and not
#   including the next line that starts with "<n+1>. ", or to the end of the file when none follows.
#   PARA(<name>) = the paragraph of BODY(<name>) (a run of lines between blank lines) whose first line starts
#   with `**Which script.**`.
#   flat(x) = x with every run of white space replaced by one space, leading and trailing white space removed.
#   expect.output keys: equals = the exact value read; holds = a list of strings, each a substring of the text
#   read; starts_with = a string the text read starts with; lacks = a list, each a string or, with a "re:" prefix,
#   a Python regular expression (re.search), none of which occurs in the text read; count = how many times a
#   string occurs.
#   These cases run nothing but file reads, except T-281.1 (git ls-files).

T-281.1:
  ac: AC-281.1
  level: integration
  target: "code:prd-toolkit/commands"
  environment: local
  identity: none
  preconditions: []
