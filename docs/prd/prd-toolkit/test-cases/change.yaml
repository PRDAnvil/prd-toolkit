# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's tmp_path, the root of the scratch repository.
#   "python" is the interpreter running the tests (sys.executable); a run has <tmp> as its working directory.
#   CHANGE = <repo>/prd-toolkit/scripts/prd_change.py; BLOCK = <repo>/prd-toolkit/scripts/prd_block.py;
#   HOOKS = <repo>/prd-toolkit/scripts/prd_hooks.py.
#   Runs and steps use the Subprocess environment (Harness) minus GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE and
#   GIT_COMMON_DIR, with PRD_PLUGINS_FILE set to fixture lint-cli/plugins_none (testing.md, the change paragraph). A relative path in a step is inside <tmp>/docs/prd/orders unless it
#   starts with <tmp>. Every line a step writes ends in a newline.
#   Setup steps (testing.md, Setup steps, the change paragraph, names this header as their definition), on the status-next steps' terms:
#   G0  N0; then in <tmp>: git config user.name Sample, git config user.email sample@example.com,
#       git config commit.gpgsign false, git config core.hooksPath /dev/null, git add -A, git commit -q -m base
#   G0N G0 without `git config core.hooksPath /dev/null`
#   GC  in <tmp>: git add -A, then git commit -q -m edit
#   GQ  prd.md line 4 `status: Approved` becomes `status: In review`
#   GA  append to features/import.md the seven lines "", "### FR-008 Refuse an empty file", "Status: approved",
#       "Acceptance (EARS):", "- AC-008.1 If the import file is empty, the importer shall exit 2.", "Errors: -",
#       "Tests: T-008.1 [integration]  (test-cases/import.yaml)" (the heading is line 31, the AC line 34); append
#       to test-cases/import.yaml an empty line and, laid out line for line as the fixture's T-001.1 is (its `input` and `expect` keeping T-001.1's flow mappings), the case T-008.1 {ac: AC-008.1, level: integration,
#       target: code:importer.import_file, environment: local, identity: none, preconditions: [],
#       input: {content: ""}, expect: {output: {exit: 2}, effects: [], errors: [], leaks: none}}
#   GR  run `python CHANGE record docs/prd/orders --base HEAD --bump minor --change 'Refuse an empty file'`; end
#       the test as an error when it exits other than 0
#   GV  run `python CHANGE digest docs/prd/orders`, take its line as <digest>, write .prd-review.json with the
#       one line {"digest": "<digest>", "ready": true, "blockers": []}; always the last step that edits the folder
#   GS  features/import.md line 11 `Status: built` becomes `Status: verified`
#   GW  features/import.md line 6: "has no header line, the importer" becomes "has no header line the importer"
#   GX  features/import.md line 6: "exit 2 with" becomes "exit 3 with"
#   GD  features/reports.md line 18 `Status: live (since 1.0.0)` becomes `Status: removed`
#   GG  prd.md, §3's row: "stored once per order key" becomes "stored once for each order key"
#   GI  features/import.md: insert after line 4 the line `Source: src/importer.py:10 @abc1234`; then GQ
#   GE  write errors.md as "# Error ledger", "", "### E-001 The importer accepts an empty file",
#       "Detected: 2026-11-20, a user report", "Classification: code bug", "Touches: FR-001",
#       "Diagnosis: the header check skips an empty file", "Resolution: open", "Recurrence of: -"
#   GT  append to test-cases/import.yaml an empty line and the case T-001.2, as T-001.1 with input {content: ""}
#   GK  contracts/errors.yaml line 5 `  message: The import file has no header line.` becomes
#       `  message: The import file has no header line (FR-001).`
#   GL  append to prd.md the row `| 1.1.0 | 2026-11-12 | a removal; no dry run (removal only) | FR-012, T-001.4, UJ-03 |`
#   GM  features/import.md: insert after line 6 the line `- AC-001.2 (removed in 1.1.0) If the file is empty, the importer shall exit 2.`
#   GP  prd.md: insert after line 13 (`- Language: Python 3.12`) the line `- Pack: service 0.9.0 (prd-toolkit)`
#   G09 prd.md line 3 `version: 1.0.0` becomes `version: 0.9.0`, and the §14 row's first cell `1.0.0` becomes `0.9.0`; then GC
#   GH  write <tmp>/CLAUDE.md with the line `# Notes`; then GC
#   GN  delete prd.md's three §14 table lines (header, separator, row)
#   GY  run `python HOOKS ci --github docs/prd/orders`; end the test as an error when it exits other than 0; then GC
#   GZ  append the line `# old` to <tmp>/.github/workflows/prd-toolkit.yml; then GC
#   R   the approval-ready state: G0, GQ, GA, GR, GV
#   DRY = 'dry run T-008.1, 0 open questions, 0 dismissed by quote'

