# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, the root of the scratch repository the
#   setup steps build from fixture status-next/base (testing.md, Setup steps); ORDERS = <tmp>/docs/prd/orders.
#   "python" is the interpreter running the tests (sys.executable); a CLI case runs the script as a subprocess
#   (testing.md Harness, Lifecycle), with the Subprocess environment minus the git variables Setup steps names.
#   GATES  = <repo>/prd-toolkit/scripts/prd_gates.py
#   ERROR  = <repo>/prd-toolkit/scripts/prd_error.py
#   LINT   = <repo>/prd-toolkit/scripts/prd_lint.py
#   STATUS = <repo>/prd-toolkit/scripts/prd_status.py
#   HELP   = <repo>/prd-toolkit/scripts/prd_help.py
#   A case runs from ORDERS with `.` as the PRD folder unless it gives another cwd. `files.<key>` is the text at
#   that key of fixture card-context/files, or of status-next/files where a step or a case says so. The full
#   state (steps N0, C1, CE, CK, CS, NR3, NA1, CB, CA1) holds one gate of each kind: the approval gate
#   approval:cards, four error-class gates, a deploy-step gate, an adoption gate and a signoff gate; import's
#   `Target:` line has the URL https://example.com/orders/import, reports' has no url part, billing's has
#   https://example.com/orders/billing, and E-001 has its own `URL:` line.
#   A path like `gates.1.url` is a stdout_json_at path (testing.md Harness, Assertions).

T-062.1:
  ac: AC-062.1
  level: integration
  target: "cli:prd_gates"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  - card-context/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup:
    - N0
    - C1
    - CE
    - CK
    cwd: ORDERS
    command: python GATES list --json .
    note: "E-002 touches FR-006 (reports) and FR-002 (import), listed in the PRD's area order; E-003 touches FR-006, and T-001.1 of FR-001 (import) is known-failing on it (CK), so its Touches area comes first; E-004 has `Touches: -` (Review focus 5)"
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_json_at:
        gates.0.id: "error-class:E-001"
        gates.0.areas:
        - import
        gates.1.id: "error-class:E-002"
        gates.1.areas:
        - import
        - reports
        gates.2.id: "error-class:E-003"
        gates.2.areas:
        - reports
        - import
        gates.3.id: "error-class:E-004"
        gates.3.areas: []
    effects: []
    errors: []
    leaks: none

