      each_run:
        exit: 0
        stderr: ""
      relations:
      - "each run's stdout is one line ending in a newline, parsed as one JSON object: run_1's Next items are the entries of its `items` whose `part` is `Next`, in order, and run_2's gates are its `gates` list"
