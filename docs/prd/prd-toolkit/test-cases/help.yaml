    leaks: none

T-035.1:
  ac: AC-035.1
  level: integration
  target: cli:prd_help
  environment: local
  identity: none
  preconditions: [help/catalogue]
  input:
    cwd: <tmp>
    command: python HELP --json
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_json_keys_at:
        "": [interface, kind, entries, rules]
        entries.0: [key, name, what, why, rules, checked_by, see]
        entries.1: [key, name, what, why]
        entries.2: [key, name, what, why, checked_by]
        rules.ac-ears: [severity, description]
      stdout_json_at:
        interface: 1
        kind: help
        entries:
          - key: block.ac
            name: Acceptance criterion
            what: One testable statement of what the system does.
            why: Each criterion gets a test case.
            rules: ["`- AC-nnn.n <text>`, where nnn is the requirement's number.", The text starts with an EARS opener.]
            checked_by: [ac-ears, platform-word]
            see: Requirement blocks
          - {key: kind.FR, name: Requirement, what: One thing the system does., why: A build is verified against it.}
          - {key: marker.assumption, name: Assumption marker, what: "A guess the author made — written where it applies.", why: An open assumption blocks approval., checked_by: [ac-ears]}
        rules.ac-ears.severity: error
        rules.platform-word.severity: warn
      stdout_contains: "made — written"      # the dash as itself, in UTF-8 (the bytes e2 80 94)
      stdout_not_contains: "\\u2014"
      relations:
        - "the keys of the document's `rules` object are exactly RULES, in that order"
    effects: []
    errors: []
    leaks: none

