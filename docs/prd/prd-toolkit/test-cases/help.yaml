        - "run_2's stdout lines are exactly two: `vague-word (error)`; the description of vague-word in run_4's document"
        - "run_3's stdout lines are exactly three: `platform-word (warn)`; the description of platform-word in run_4's document; `Checks: block.ac`"
    effects: []
