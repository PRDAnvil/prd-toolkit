T-036.3:
  ac: AC-036.3
  level: integration
  target: cli:prd_help
  environment: local
  identity: none
  preconditions: []
  input:
    setup:
      - "write <tmp>/b2.yaml with the text `key: a.b\\n` (a mapping, not a list)"
      - "write <tmp>/b3.yaml with the three lines `- key: a.b`, `  name: A`, `  what: W`"
      - "write <tmp>/b4.yaml with the eight lines `- key: a.b`, `  name: A`, `  what: W`, `  why: Y`, `- key: a.b`, `  name: B`, `  what: W`, `  why: Y`"
      - "write <tmp>/b5.yaml with the five lines `- key: a.b`, `  name: A`, `  what: W`, `  why: Y`, `  checked_by: [ac-ears, no-such-rule]`"
      - "write <tmp>/b6.yaml with the one line `- [`"
      - "write <tmp>/b7.yaml with the one line `- just text`"
      - "write <tmp>/b8.yaml with the five lines `- key: a.b`, `  name: A`, `  what: W`, `  why: Y`, `  rules: one rule`"
      - "write <tmp>/b9.yaml with the five lines `- key: a.b`, `  name: A`, `  what: W`, `  why: Y`, `  see: [a, b]`"
      - "write <tmp>/b10.yaml with the four lines `- key: a.b`, `  name: \"\"`, `  what: W`, `  why: Y`"
    cwd: <tmp>
    runs:
      - {env: {PRD_HELP_FILE: <tmp>/b1.yaml}, command: python HELP}                    # the file does not exist
      - {env: {PRD_HELP_FILE: <tmp>/b2.yaml}, command: python HELP}
      - {env: {PRD_HELP_FILE: <tmp>/b3.yaml}, command: python HELP --key a.b}
      - {env: {PRD_HELP_FILE: <tmp>/b4.yaml}, command: python HELP --rule ac-ears}
      - {env: {PRD_HELP_FILE: <tmp>/b5.yaml}, command: python HELP}
      - {env: {PRD_HELP_FILE: <tmp>/b6.yaml}, command: python HELP}
      - {env: {PRD_HELP_FILE: <tmp>/b7.yaml}, command: python HELP}
      - {env: {PRD_HELP_FILE: <tmp>/b8.yaml}, command: python HELP}
      - {env: {PRD_HELP_FILE: <tmp>/b9.yaml}, command: python HELP}
      - {env: {PRD_HELP_FILE: <tmp>/b10.yaml}, command: python HELP --key nothing}     # the catalogue wins over the unknown key
  expect:
    output:
      each_run:
        exit: 2
        stdout: ""
        stderr_not_contains: Traceback
      run_1:
        stderr: "prd_help: <tmp>/b1.yaml: no such file\n"
      run_2:
        stderr: "prd_help: <tmp>/b2.yaml: top level must be a list\n"
      run_3:
        stderr: "prd_help: <tmp>/b3.yaml: entry 1: missing 'why'\n"
      run_4:
        stderr: "prd_help: <tmp>/b4.yaml: entry 2: duplicate key 'a.b'\n"
      run_5:
        stderr: "prd_help: <tmp>/b5.yaml: entry 1: checked_by names no rule 'no-such-rule'\n"
      run_6:
        stderr_single_line_starts: "prd_help: <tmp>/b6.yaml: YAML parse error: "
      run_7:
        stderr: "prd_help: <tmp>/b7.yaml: entry 1: must be a mapping\n"
      run_8:
        stderr: "prd_help: <tmp>/b8.yaml: entry 1: 'rules' must be a list of strings\n"
      run_9:
        stderr: "prd_help: <tmp>/b9.yaml: entry 1: 'see' must be a string\n"
      run_10:
        stderr: "prd_help: <tmp>/b10.yaml: entry 1: missing 'name'\n"
    effects: []
    errors: []
    leaks: none

