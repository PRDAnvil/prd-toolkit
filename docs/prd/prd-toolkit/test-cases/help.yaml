      run_2:
        stdout_json_keys_at:
          rules: [ac-ears]
        stdout_json_at:
          entries.0.key: block.ac
          entries.1.key: marker.assumption
          rules.ac-ears.severity: error
      run_3:
        stdout_json_keys_at:
          rules: [vague-word]
        stdout_json_at:
          entries: []
      relations:
        - "run_1's `rules` object equals run_4's `rules` object"
        - "run_2's `entries` list holds exactly two entries, equal to entries 0 and 2 of run_4's `entries`"
        - "run_2's `rules.ac-ears` equals run_4's `rules.ac-ears`"
    effects: []
    errors: []
    leaks: none

