# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path.
#   "python" is the interpreter running the tests (sys.executable); a CLI case runs
#   `python <repo>/prd-toolkit/scripts/prd_help.py ...` as a subprocess (testing.md Harness, Lifecycle).
#   HELP = <repo>/prd-toolkit/scripts/prd_help.py
#   LINT = <repo>/prd-toolkit/scripts/prd_lint.py
#   FIX  = the absolute path of fixture help/catalogue,
#          <repo>/docs/prd/prd-toolkit/contracts/fixtures/help/catalogue.yaml (testing.md Fixtures).
#   A case whose preconditions name help/catalogue runs every command with PRD_HELP_FILE=FIX,
#   unless a run gives its own env. Every other case runs with PRD_HELP_FILE unset (testing.md
#   Harness, Subprocess environment), so it reads the catalogue the toolkit ships.
#   A run written as a mapping {env: …, command: …} adds that env for that run only.
#   "the description of <rule>" is the value at rules.<rule>.description of the document
#   `python HELP --json` prints in the same case; the PRD does not fix its wording.
#   RULES = the 40 rule names of T-003.1 (test-cases/lint-cli.yaml), sorted; `platform-word` is the
#   only one of severity warn.

T-033.1:
  ac: AC-033.1
  level: integration
  target: cli:prd_help
  environment: local
  identity: none
  preconditions: [help/catalogue]
  input:
    cwd: <tmp>
    command: python HELP
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_exact_lines: ["block.ac  Acceptance criterion", "kind.FR  Requirement", "marker.assumption  Assumption marker", "",
        "ac-ears  error", "ac-has-test  error", "assumption-indexed  error", "change-sets  error",
        "classified-fixtures  error", "contracts-valid  error", "deny-tested  error", "drift-rows  error",
        "error-codes  error", "error-entries  error", "fr-has-ac  error", "frontmatter  error",
        "glossary-synonym  error", "id-format  error", "id-removed-reused  error", "id-unique  error",
        "index-consistent  error", "judged-case  error", "language-table  error", "links-format  error",
        "markers-open  error", "nfr-bound  error", "open-questions-empty  error", "pack-resolves  error",
        "placeholder  error", "platform-word  warn", "production-gate  error", "registries  error",
        "runbook-env  error", "runbook-steps  error", "runbook-tests  error", "schema-refs  error",
        "sections  error", "snapshot-cited  error", "sufficiency  error", "test-cases-consistent  error",
        "test-level  error", "test-refs  error", "upstream-refs  error", "vague-word  error"]
    effects: []
    errors: []
    leaks: none

