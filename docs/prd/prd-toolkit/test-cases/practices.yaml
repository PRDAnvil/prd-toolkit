T-050.2:
  ac: AC-050.2
  level: integration
  target: cli:prd_practices
  environment: local
  identity: none
  preconditions: [practices/repo]
  refs: ["testing.md#Setup steps"]
  input:
    setup: [P0]
    cwd: <tmp>
    runs:
      - python PRACTICES docs/prd/orders --paths src/orders/importer.py
      - python PRACTICES docs/prd/orders --paths src/a.py                                    # `**/` stands for zero folders
      - python PRACTICES docs/prd/orders --paths tests/unit/test_a.py                        # `*` does not cross `/`
      - python PRACTICES docs/prd/orders --paths tests/test_b.py README.md src/x/y/z.py      # table order, not path order
      - python PRACTICES docs/prd/orders --paths -                                           # P-03's `-` is a prd practice's
      - python PRACTICES docs/prd/orders --paths SRC/orders/importer.py                      # case counts
      - python PRACTICES docs/prd/orders --paths src/orders/importer.pyc                     # the whole path
      - python PRACTICES docs/prd/orders --paths src/orders/importer.py src/a.py             # each practice once
  expect:
    output:
      each_run:
        exit: 0
        stderr: ""
      run_1:
        stdout_exact_lines: ["P-01 (S-01, code, src/**/*.py): Each public function has a docstring."]
      run_2:
        stdout_exact_lines: ["P-01 (S-01, code, src/**/*.py): Each public function has a docstring."]
      run_3:
        stdout: ""
      run_4:
        stdout_exact_lines:
          - "P-01 (S-01, code, src/**/*.py): Each public function has a docstring."
          - "P-02 (S-01, code, tests/*.py): Each test names the case it proves in its docstring."
      run_5:
        stdout: ""
      run_6:
        stdout: ""
      run_7:
        stdout: ""
      run_8:
        stdout_exact_lines: ["P-01 (S-01, code, src/**/*.py): Each public function has a docstring."]
    effects: []
    errors: []
    leaks: none

