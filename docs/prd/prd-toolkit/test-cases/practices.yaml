# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, the root of the scratch repository step P0
#   builds (testing.md, Setup steps); <resolved tmp> is Path(<tmp>).resolve(); ORDERS = <tmp>/docs/prd/orders.
#   "python" is the interpreter running the tests (sys.executable); a CLI case runs the script as a subprocess
#   (testing.md Harness, Lifecycle), with <tmp> as the working directory.
#   PRACTICES = <repo>/prd-toolkit/scripts/prd_practices.py
#   LINT      = <repo>/prd-toolkit/scripts/prd_lint.py
#   CHANGE    = <repo>/prd-toolkit/scripts/prd_change.py
#   CONTEXT   = <repo>/prd-toolkit/scripts/prd_context.py
#   DISPATCH  = <repo>/prd-toolkit/scripts/prd_dispatch.py
#   The setup steps (P0, PN, PB1, ...) run in the order a case lists them; a path in a step is inside ORDERS
#   unless it starts with <tmp>. The fixture's practices.md has the S-01 row on line 7, S-02 on line 8, P-01 on
#   line 14, P-02 on line 15 and P-03 on line 16; its prd.md has the section 5 row on line 45.
#   A lint finding's path starts `docs/prd/orders/`, the folder as the command line names it (AC-002.1).
#   `pack_part_titles` and `pack_part_lines` are the assertion keys testing.md defines (Harness, Assertions).

T-048.1:
  ac: AC-048.1
  level: integration
  target: cli:prd_practices
  environment: local
  identity: none
  preconditions: [practices/repo]
  refs: ["testing.md#Setup steps"]
  input:
    setup: [P0, PM]
    cwd: <tmp>
    runs:
      - python LINT docs/prd/orders
      - python PRACTICES docs/prd/orders
      - python PRACTICES --json docs/prd/orders
      - python CHANGE ids next docs/prd/orders S
      - python CHANGE ids next docs/prd/orders P
      - python CONTEXT docs/prd/orders --area import --for implement
    note: "PM moves practices.md to notes/practices.md: the PRD has no record, and the file in a subfolder is not one; run_6's part titles are the implement pack's without this area (AC-055.4)"
  expect:
    output:
      each_run:
        exit: 0
        stderr: ""
      run_1:
        stdout: ""
      run_2:
        stdout: ""
      run_3:
        stdout_json: {interface: 1, kind: practices, sources: [], practices: []}
      run_4:
        stdout: "S-01\n"
      run_5:
        stdout: "P-01\n"
      run_6:
        pack_part_titles: ["## Header", "## Stack", "## Glossary", "## Requirements", "## Code", "## Levels", "## Cited", "## Known defects", "## Open questions", "## History"]
    effects: []
    errors: []
    leaks: none

