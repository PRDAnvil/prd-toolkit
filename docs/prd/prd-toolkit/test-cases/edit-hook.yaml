    cwd: <tmp>
    command: python <repo>/prd-toolkit/scripts/prd_edit_hook.py post
    stdin: {session_id: <sid>, cwd: <tmp>, hook_event_name: PostToolUse, tool_name: Edit, tool_input: {file_path: <tmp>/src/orders/importer.py}}
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_json: {hookSpecificOutput: {hookEventName: PostToolUse, additionalContext: "prd-toolkit: src/orders/importer.py is in area import of docs/prd/orders, and no block of that area is approved at HEAD; a behaviour change there starts with /prd-toolkit:prd-change before any code, and a change of no behaviour cites Refs: none (no behaviour change)."}}
