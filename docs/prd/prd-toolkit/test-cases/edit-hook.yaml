T-280.1:
  ac: AC-280.1
  level: integration
  target: cli:prd_edit_hook
  environment: local
  identity: none
  preconditions: []
  input:
    cwd: <repo>
    command: python -c "import json, sys; print(json.dumps(json.load(open(sys.argv[1], encoding='utf-8'))))" prd-toolkit/hooks/hooks.json
  expect:
    output:
      exit: 0
      stderr: ""
      stdout_json:
        hooks:
          PreToolUse:
            - matcher: Read|Glob|Grep|Write|Edit|NotebookEdit|Bash
              hooks:
                - {type: command, command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/prd_tester_guard.py"'}
          PostToolUse:
            - matcher: Edit|Write|MultiEdit|NotebookEdit
              hooks:
                - {type: command, command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/prd_edit_hook.py" post', timeout: 5}
          Stop:
            - hooks:
                - {type: command, command: 'python3 "${CLAUDE_PLUGIN_ROOT}/scripts/prd_edit_hook.py" stop', timeout: 60}
      stdout_json_keys_at: {"": [hooks], hooks: [PreToolUse, PostToolUse, Stop]}
    effects: []
    errors: []
    leaks: none
