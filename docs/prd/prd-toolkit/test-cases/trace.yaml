# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, written as its resolved absolute path wherever
#   it appears in an expected value. Every scratch repository is built from fixture status-next/empty by step N0E
#   (testing.md, Setup steps); its PRD folder is docs/prd/orders, and a relative path in a step is inside that folder
#   unless it starts with <tmp> or says "in <tmp>". "python" is the interpreter running the tests (sys.executable);
#   every run is a subprocess with the Subprocess environment minus GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE and
#   GIT_COMMON_DIR, plus the case's own env.
#   TRACE = <repo>/prd-toolkit/scripts/prd_trace.py      HOOK = <repo>/prd-toolkit/scripts/prd_git_hook.py
#   A test file under prd-toolkit/tests/ builds each "@prd T-…" text below from parts (testing.md Layout).
#   The steps a case names in its setup (N0E, TB, TU, TC9, TS, TL, TD, TA, TE, TEC, TK, TX, TM, TR, TV, SH) are
#   testing.md's (Setup steps: the status-next step N0E and the trace steps); a step written `TS:x` takes the
#   text after its colon as x.

T-082.1:
  ac: AC-082.1
  level: integration
  target: "cli:prd_trace"
  environment: local
  identity: none
  preconditions: [status-next/empty]
  refs: ["testing.md#Setup steps"]
  input:
    setup: [N0E, "append the line `# @prd T-009.1` to <tmp>/tests/test_orders.py (it becomes line 3)"]
    cwd: "<tmp>"
    command: python TRACE docs/prd/orders
  expect:
    output: {exit: 1, stdout: "tests/test_orders.py:3: test-cites-live: cites T-009.1, which does not exist in the PRD\n", stderr: ""}
    effects: []
    errors: []
    leaks: none

