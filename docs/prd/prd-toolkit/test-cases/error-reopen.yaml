# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, the root of the scratch repository the steps
#   build from fixture status-next/base (testing.md, Setup steps); ORDERS = <tmp>/docs/prd/orders, and a relative
#   path in a step or an expected value is inside ORDERS unless it starts with <tmp>. "python" is the interpreter
#   running the tests (sys.executable). ERROR = <repo>/prd-toolkit/scripts/prd_error.py,
#   GATES = <repo>/prd-toolkit/scripts/prd_gates.py, LINT = <repo>/prd-toolkit/scripts/prd_lint.py,
#   HELP = <repo>/prd-toolkit/scripts/prd_help.py.
#   A run's text becomes its argument list this way: ERROR, GATES, LINT and HELP are replaced by their values, the
#   text is split into words with Python's shlex.split (quotes group words and are removed, nothing is expanded),
#   and a first word `python` becomes the interpreter running the tests; the words are run with no shell, from
#   <tmp>, as a subprocess. `run_<n>` names the n-th run of a case and `each_run` every run; <today> is as
#   testing.md (Harness, Assertions) defines it, and `files.<key>` is the text at that key of fixture
#   status-next/files.
#   Every run, every command of a step and the test's own git commands use the Subprocess environment (Harness)
#   minus GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE, GIT_COMMON_DIR and PRD_PLUGINS_FILE, plus
#   GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM=1, which the test sets in its own process, through pytest's
#   monkeypatch, before its first step, so that the `git init` of step N0 inherits them too. A step's command must
#   exit 0, and a step that does not find the line or the text it changes ends the test as an error, not a failure.
#   Every line a step writes ends in a newline. A step that commits runs, with <tmp> as the working directory,
#   `git add -A` and then `git commit -q` with the message it names.
#   Steps run in the order a case lists them. N0, NE1 and NE2 are the status-next steps; the steps below are this
#   file's own.
#     O0  N0; then run `git config user.name Sample`, `git config user.email sample@example.com`,
#         `git config commit.gpgsign false` and `git config core.hooksPath /dev/null`
#     OC  NE1: errors.md is files.errors_confirmed, E-001 `confirmed` (`code bug`; its line 6 is
#         `Confirmed: 2026-11-04, "Yes, it is a code bug."`) and E-002 `unclassified`
#     OP  NE2: errors.md is files.errors_proposed, E-001 `proposed` (`code bug`), with no Diagnosis: line
#     OM  write errors.md with the lines `# Error ledger`, ``, `### E-001 The importer stops at row 1000`,
#         `Detected: 2026-11-03, a run on the October file`, `Classification: code bug`, `Touches: FR-003`,
#         `Resolution: -`, `Recurrence of: -`, ``, `### E-002 A monthly report printed no total`,
#         `Detected: 2026-11-05, a reader of the October report`, `Classification: unclassified`,
#         `Touches: FR-006`, `Resolution: -`, `Recurrence of: -`, ``, `### E-003 An import printed no count`,
#         `Detected: 2026-11-06, a run on the November file`, `Classification: code bug`,
#         `Confirmed: 2026-11-07, "Yes."`, `Touches: FR-004`, `Resolution: not a defect: the file was empty` and
#         `Recurrence of: -` (E-001 `proposed`, E-002 `unclassified`, E-003 resolved)
#     OK  commit `base`; then run `git tag start`
#     OX  run `python ERROR reopen docs/prd/orders E-001 --reason 'the run passes now'`; then commit with the
#         two messages `docs(prd): reopen E-001` and `Refs: E-001` (`git commit -q -m … -m …`)
#     OY  run `python ERROR confirm docs/prd/orders E-001 --reply 'Yes, a code bug after all.'`; then commit
#         `docs(prd): confirm E-001`
#     OZ  run `python ERROR reopen docs/prd/orders E-001 --reason 'the run passes again'`; then commit
#         `docs(prd): reopen E-001 again`
#     OE  in errors.md the text `"the run passes now"` becomes `"the run passed"`; then commit `edit the reopen`
#     OH  in errors.md insert after the line `Classification: unclassified` the line
#         `Reopened: 2026-11-06, "no reason"; was Confirmed: 2026-11-05, "yes"`; then commit `add a reopen`
#     OW  delete from errors.md the line `Confirmed: 2026-11-04, "Yes, it is a code bug."`; then commit
#         `drop the confirmation`
#     OS  write <tmp>/src/importer.py with the one line `x = 1`; then commit with the two messages
#         `Fix the importer` and `Refs: FR-003, E-001`
#   HEAD8 is the first 8 hex digits of what `git rev-parse HEAD` prints in <tmp> after the case's last step.

T-251.1:
  ac: AC-251.1
  level: integration
  target: "cli:prd_error"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - status-next/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup: [O0, OC]
    runs:
    - "python ERROR reopen docs/prd/orders E-001 --reason 'the run passes now'"
    - "python ERROR list docs/prd/orders"
  expect:
    output:
      run_1:
        exit: 0
        stdout: "E-001 proposed code bug\n"
        stderr: ""
      run_2:
        exit: 0
        stdout: "E-001 proposed code bug FR-003 The importer stops at row 1000\nE-002 unclassified FR-006 A monthly report printed no total\n"
        stderr: ""
    effects:
    - "after run_1, errors.md is files.errors_confirmed with its line 6, `Confirmed: 2026-11-04, \"Yes, it is a code bug.\"`, replaced by the line `Reopened: <today>, \"the run passes now\"; was Confirmed: 2026-11-04, \"Yes, it is a code bug.\"`, and every other byte as it was"
    errors: []
    leaks: none

