# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below (they extend those of lint-cli.yaml, lint-structure.yaml and lint-ids.yaml):
#   <repo> is the repository root; <tmp> is the test's own tmp_path, written as an absolute path where a value
#   takes it; <P> is <tmp>/docs/prd/orders. "python" is the interpreter running the tests (sys.executable).
#   S0 = write each entry of fixture lint-cli/orders (contracts/fixtures/lint-cli/orders.yaml) to <P>/<key>, creating
#   parent folders, and set PRD_PLUGINS_FILE to the absolute path of fixture lint-cli/plugins_superpowers.json.
#   With S0 alone the folder lints clean (T-001.1).
#   A file named in a setup step is relative to <P> unless it starts with <tmp>. "line N of F" is line N of F as S0
#   wrote it, before any other step of the case; "replace line N of F with X" keeps every other line; "insert X
#   after line N of F" makes X line N+1 (several lines listed in order follow one another); "delete line N of F"
#   removes it; "delete the file F" removes F; "append X to F" adds each line of X, each with a newline, after F's final newline; "write F with the
#   lines X" creates F, and its folders, holding each line of X and a newline. A step that does not find the file or
#   the line it names ends the test as an error, not a failure.
#   "texts.<key>" (a whole value) stands for the string, or the list of strings, one line each, under <key>; "the three lines of texts.<key>" writes its items in order in fixture lint-registries/texts
#   (contracts/fixtures/lint-registries/texts.yaml, read with yaml.safe_load). Texts that a lint of this PRD folder
#   would itself report (a clarification marker, a malformed ID) live there.
#   LINT = python <repo>/prd-toolkit/scripts/prd_lint.py docs/prd/orders, run with <tmp> as its working directory.
#   HELP = python <repo>/prd-toolkit/scripts/prd_help.py.
#   A run written as a mapping {env: ..., command: ...} adds that env for that run only (Harness, Subprocess
#   environment, which removes PRD_LINT_CI from the runner's environment).
#   A case whose output has no exit key does not assert the exit code: other rules may report its edits.
#   Every run, and every command of a step, uses the Subprocess environment (Harness) minus GIT_DIR, GIT_WORK_TREE,
#   GIT_INDEX_FILE and GIT_COMMON_DIR, so a suite started from a git hook still sees <tmp> as its own place. A step whose
#   own command exits other than 0 ends the test as an error. A precondition that a case's note states (a program not on
#   PATH, a folder outside a git checkout, a path that does not exist, the git toplevel of a folder) is checked by the
#   test before the run, and one that does not hold ends the test as an error.
#   A note in parentheses at the end of a setup step that speaks of spaces or of line numbers, such as (three spaces
#   before Run), (nothing after the colon) or (lines 15 to 18), describes what the step writes and is no part of it. Any
#   other parenthesis belongs to the line: the runbook's own (actor: ...) and (env: ...), and the words of a message.
#   "insert after line N of F the line X" is the same step as "insert X after line N of F".
#   The tests' helpers (S0, the runs of LINT and HELP, the assertions) are defined in this area's own support file,
#   lint_registries_support.py (testing.md, Layout); the tests import nothing from another area's support file.
#   A run written as a mapping may hold before: <step>. That step is applied after the run before it and before this
#   run, on the folder as the earlier run left it; "line N of F" in it is line N of F as it stands at that moment.
