# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path, the root of the scratch repository the
#   setup steps build (testing.md, Setup steps); ORDERS = <tmp>/docs/prd/orders, the PRD folder they write.
#   "python" is the interpreter running the tests (sys.executable); a CLI case runs
#   `python <repo>/prd-toolkit/scripts/prd_status.py ...` as a subprocess (testing.md Harness, Lifecycle).
#   STATUS = <repo>/prd-toolkit/scripts/prd_status.py
#   LINT   = <repo>/prd-toolkit/scripts/prd_lint.py
#   TRACE  = <repo>/prd-toolkit/scripts/prd_trace.py
#   GATES  = <repo>/prd-toolkit/scripts/prd_gates.py
#   Every case but T-043.7 runs its commands with ORDERS as the working directory and `.` as the PRD folder;
#   T-043.7 runs from <tmp> with `docs/prd/orders`. A Next sentence quotes a lint or trace finding with the
#   path inside the PRD folder (`contracts/errors.yaml`) whatever the working directory.
#   The setup steps (N0, NL1, ...) run in the order a case lists them. A case's preconditions name the
#   fixtures its steps read: status-next/base or status-next/empty, and status-next/files.
#   `next_part_lines` and `next_items_json` are the assertion keys testing.md defines (Harness, Assertions).

T-040.1:
  ac: AC-040.1
  level: integration
  target: cli:prd_status
  environment: local
  identity: none
  preconditions: ["status-next/base", "status-next/files"]
  refs: ["testing.md#Setup steps"]
  input:
    setup: ["N0"]
    cwd: ORDERS
    runs:
      - python STATUS .
      - python STATUS --json .
  expect:
    output:
      each_run:
        exit: 0
        stderr: ""
      run_1:
        next_part_lines:
          - "## Next"
          - ""
          - "1. 1 requirement is verified and not live."
          - "  run: /prd-toolkit:prd-deploy"
          - "2. FR-002 is built and not verified."
          - "  run: /prd-toolkit:prd-build import FR-002"
          - "3. FR-001 is approved and not built."
          - "  run: /prd-toolkit:prd-build import FR-001"
          - "4. FR-005 is approved and not built."
          - "  run: /prd-toolkit:prd-build reports FR-005"
          - ""
      run_2:
        next_items_json:
          - {"part": "Next", "id": null, "text": "1 requirement is verified and not live.", "kind": "deploy", "ids": ["FR-003"], "area": null, "command": "/prd-toolkit:prd-deploy", "waits_on": "agent"}
          - {"part": "Next", "id": null, "text": "FR-002 is built and not verified.", "kind": "verify", "ids": ["FR-002"], "area": "import", "command": "/prd-toolkit:prd-build import FR-002", "waits_on": "agent"}
          - {"part": "Next", "id": null, "text": "FR-001 is approved and not built.", "kind": "build", "ids": ["FR-001"], "area": "import", "command": "/prd-toolkit:prd-build import FR-001", "waits_on": "agent"}
          - {"part": "Next", "id": null, "text": "FR-005 is approved and not built.", "kind": "build", "ids": ["FR-005"], "area": "reports", "command": "/prd-toolkit:prd-build reports FR-005", "waits_on": "agent"}
    effects: []
    errors: []
    leaks: none

