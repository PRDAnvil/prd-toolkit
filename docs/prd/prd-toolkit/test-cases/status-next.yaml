          - "FR-006: T-006.1 integration build cited"
          - "FR-007: T-007.1 integration build cited"
      run_2:
        stdout_json_keys_at:
          "": [interface, kind, prd, version, items]
    effects: []
    errors: []
    leaks: none

T-040.3:
  ac: AC-040.3
  level: unit
  target: code:prd_status.main
  environment: local
  identity: none
  preconditions: [status-next/base, status-next/files]
  refs: ["testing.md#Setup steps"]
  input:
    setup: [N0]
    cwd: ORDERS
    call: "with the function that computes the Next part made to raise `ValueError('boom')` (pytest monkeypatch), call `prd_status.main(['.'])`, then `prd_status.main(['--json', '.'])`"
  expect:
    output:
      return: "each call returns 2 and prints the one stderr line `prd_status: internal error: ValueError: boom`; the first prints nothing on stdout; the second prints on stdout only the line `{\"interface\": 1, \"kind\": \"status\", \"error\": \"internal error: ValueError: boom\"}`"
    effects: []
    errors: []
    leaks: none

