# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below: those of lint-registries.yaml (<repo>, <tmp>, <P>, S0, LINT, the setup steps, runs
#   written as a mapping {env: ..., command: ...}, the Subprocess environment, notes in parentheses about spaces or line
#   numbers), and these:
#   "delete lines N to M of F" deletes each line from N to M. "write F with the lines X" does not set the file's
#   execute permission; "make F executable" adds the execute permission for F's owner (chmod u+x).
#   A "Pack:" line whose source is (prd-toolkit) resolves to the toolkit's own pack, <repo>/prd-toolkit/packs/<name>/:
#   <tmp> holds no .prd-toolkit/ folder and LINT runs the plugin's script. The pack document 1.0.0 declares the
#   contract type outline with a validator other than built-in.
#   stdout_contains requires the text to appear in stdout; stdout_contains_line requires a stdout line equal to it.
#   A finding line in expect names the line as the file stands after every step of its run.
#   "python3" in a validator command is the python3 on PATH (testing.md, Tools on the runner).
#   The tests' helpers are defined in this area's own support file, lint_contracts_support.py (testing.md, Layout); the
#   tests import nothing from another area's support file.
#   S0 writes each fixture text as UTF-8. Every run of these cases uses the Subprocess environment (Harness) minus
#   PRD_VALIDATOR_TIMEOUT as well, plus the case's own env, so only a case that sets the timeout changes it (T-182.5).
#   A case that writes <tmp> into a Files cell (T-181.7) assumes a temporary folder whose path holds no white space,
#   no comma and none of the glob characters * ? [ ]; the test checks that before its first step, and a path that
#   breaks it ends the test as an error.
#   A symptom that says a line "starts with" a text in backticks requires the line to start with exactly the text
#   between the backticks.
T-170.1:
  ac: AC-170.1
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0, "replace line 1 of contracts/openapi.yaml with openapi: 9.9.9", "replace line 25 of contracts/openapi.yaml with       x-effect: [] (six spaces before x-effect)"]
    cwd: <tmp>
    command: LINT
  expect:
    output:
      exit: 1
      stdout_contains: "docs/prd/orders/contracts/openapi.yaml:1: contracts-valid: openapi validation failed: "
      stdout_contains_line: "docs/prd/orders/contracts/openapi.yaml:19: contracts-valid: GET /orders/{id}: x-effects must be a list (use [] for none)"
      stderr: ""
    effects: []
    errors: []
    leaks: none
