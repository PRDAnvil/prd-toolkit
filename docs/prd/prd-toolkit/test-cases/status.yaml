# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's tmp_path, the root of the scratch repository the steps build;
#   RTMP is <tmp> resolved (Path.resolve()), written wherever a run prints an absolute path; ORDERS = <tmp>/docs/prd/orders.
#   "python" is the interpreter running the tests. STATUS = <repo>/prd-toolkit/scripts/prd_status.py,
#   BLOCK = <repo>/prd-toolkit/scripts/prd_block.py, VBLOCK = <tmp>/.prd-toolkit/prd_block.py.
#   A run takes its working directory from the case's cwd: ORDERS for every cli:prd_status case unless the case says
#   otherwise, and <tmp> for every cli:prd_block case unless the case says otherwise.
#   Steps run in the order a case lists them, on the status-next steps' terms (testing.md, Setup steps): N0, N0X,
#   NA1, NE1, NE2, NB2, NLV, NR1 to NR4 and NT1 are those steps. The steps below are this file's own. A relative path
#   in a step is inside ORDERS unless it starts with <tmp>. Every line a step writes ends in a newline unless the
#   step says otherwise. A step that does not find the line it edits ends the test as an error.
#     SB0  run `python BLOCK docs/prd/orders` with <tmp> as the working directory; it must exit 0
#     SVER in prd.md the line `version: 1.0.0` becomes `version: 1.1.0`
#     SH0  delete the frontmatter line `status: Approved` from prd.md
#     SU8  in prd.md the line `Not applicable: new project.` becomes the three lines `| Area | State | Boundary |`,
#          `|---|---|---|` and `| import | adopted | `src/**` |`
#     S8   in prd.md the line `Not applicable: new project.` becomes `See adoption.md.`; no adoption.md is written
#     SR6  in prd.md the line `Not applicable: the fixture requires no skill.` becomes the four lines
#          `| Object or activity | Skill | Decision |`, `|---|---|---|`,
#          `| a code change | `superpowers:test-driven-development` | required |` and `| a review | code-review | recommended |`
#     SP1  in prd.md insert after the line `- Language: Python 3.12` the line `- Pack: document 1.0.0 (prd-toolkit)`
#     SS1  in prd.md the line `The orders service imports order files and prints monthly reports.` becomes the three
#          lines `<!-- a note -->`, `The orders service imports order files. It prints` followed by three spaces,
#          and `monthly reports.`
#     SS2  delete from prd.md the line `The orders service imports order files and prints monthly reports.`
#     SS3  in prd.md insert after the line `- Import a 10,000-row file in under 60 seconds.` the nine lines ``,
#          `Principles: Keep it small.`, ``, `- **Plain.** One command, one answer.`, ``, `Getting started:`, ``,
#          `1. Install the service.` and `2. Import a file.`
#     SS4  in prd.md the line `The orders service imports order files and prints monthly reports.` becomes
#          `The orders service imports order files and prints monthly reports. <!-- prd-toolkit:end -->`
#     SS5  in prd.md insert after the line `The orders service imports order files and prints monthly reports.` the
#          line `<!-- prd-toolkit:start -->`
#     SS6  in prd.md the line `The orders service imports order files and prints monthly reports.` becomes
#          `Does it import files? Yes, v1.2 does.`
#     SN1  in nfr.md insert after line 1, `# Non-functional requirements`, the lines `` , `### NFR-008 Import speed`
#          and `Status: verified`
#     SZ   delete features/import.md and features/reports.md
#     SA1  in features/reports.md insert after line 1, `# Reports`, the line `Target: output language pt-BR`
#     SA2  after NA1: in adoption.md the line `| import | adopted | `src/import/**` |` becomes
#          `| import | adopted | `src/import/**`, `tests/test_import.py` |` and the line
#          `| audit | not started | `src/audit/**` |` becomes `| audit | not started |  |`
#     SA3  after NA1: delete lines 5 to 9 of adoption.md, its five rows
#     SM1  in features/import.md the line `Tests: T-001.1 [integration]  (test-cases/import.yaml)` becomes
#          `Tests: T-001.1 [system]  (test-cases/import.yaml)`
#     SU1  append to features/import.md the lines ``, `### UJ-01 An operator imports a file`, `Status: verified` and
#          `Flow: 1. run the importer`
#     SR7  in features/reports.md the line `Status: live (since 1.0.0)` under `### FR-007 Refuse an unknown month`
#          becomes `Status: removed`
#     SAB  in features/import.md the line `Status: live (since 1.0.0)` (under FR-004) becomes `Status: as-built`
#     SE1  write errors.md with the lines `# Error ledger`, ``, `### E-001 The importer stops at row 1000`,
#          `Detected: 2026-11-03, a run on the October file`, `Classification: code bug`, `Touches: FR-003`,
#          `Resolution: not a defect: the file was cut short` and `Recurrence of: -` (one resolved entry)
#     SK1  write links.md with the lines `# Links`, ``, `## Upstreams`, ``, `| Upstream | Location | Version | Commit | Needs |`,
#          `|---|---|---|---|---|`, `| greet | `https://example.com/greet.git#docs/prd/greet` | 1.1.0 | 4f1c9a2 |  |`, ``,
#          `## Consumers`, ``, `| Consumer | Location |`, `|---|---|` and
#          `| dashboards | `git@example.com:org/bi.git#docs/prd/dashboards` |`
#     SK2  write links.md as SK1 does, but with the Upstreams row `| billing | `../billing` | 1.0.0 | abc1234 | verified |`
#          and no Consumers row (the table's two header lines only); end the test as an error when the folder
#          <tmp>/../billing exists (a path Location is resolved against the repository root, <tmp>, as the links
#          check resolves it)
#     SK3  write links.md as SK2 does, but with the Upstreams row `| orders | `../billing` | 1.0.0 | abc1234 |  |`;
#          like SK2, end the test as an error when the folder <tmp>/../billing exists
#     SC1  write changes/CS-001.md with the lines `# CS-001 Add a flag`, ``, `Started: 2026-11-02 in orders`,
#          `Status: running`, ``, `| Order | PRD | Location | Branch | Version | IDs | Waits for | Target | State |`,
#          `|---|---|---|---|---|---|---|---|---|`,
#          `| 1 | billing | `../billing` | cs-001-add-a-flag | 1.0.0 → 1.1.0 | — | — | verified | approved |`,
#          `| 2 | orders | `.` | cs-001-add-a-flag | 1.0.0 | — | billing verified | verified | proposed |`, ``, `## Log`,
#          `` and `- 2026-11-02 started`; and changes/CS-002.md with `# CS-002 Old`, ``, `Started: 2026-10-01 in orders`,
#          `Status: done`, ``, the same two table header lines,
#          `| 1 | orders | `.` | cs-002-old | 1.0.0 | — | — | verified | verified |`, ``, `## Log`, `` and `- 2026-10-01 done`
#     SD0  append to operations.md the lines ``, `## Deployed`, ``, `| Environment | PRD version | Commit | Date | Run |` and
#          `|---|---|---|---|---|`
#     SD1  after SD0: append to operations.md `| production | 1.0.0 | 3f2c1a9 | 2026-11-02 | 20261102T103000Z-production |`
#     SD2  after SD0: append to operations.md `| staging | 1.0.0 | 3f2c1a9 | 2026-11-12 | 20261112T000000Z-all |`
#     SD3  after SD0: append to operations.md `| qa | 1.0.0 | abc1234 | 2026-11-03 | 20261103T000000Z-qa |`
#     SG1  write <tmp>/.git/prd-toolkit/deploys/20261112T100000Z-all.jsonl with the lines
#          `{"kind": "header", "run": "20261112T100000Z-all", "prd": "docs/prd/orders", "version": "1.0.0"}` and
#          `{"kind": "step", "step": 1, "env": "staging", "actor": "agent", "result": "pass"}`
#     SG2  write <tmp>/.git/prd-toolkit/deploys/20261113T090000Z-all.jsonl with the lines
#          `{"kind": "header", "run": "20261113T090000Z-all", "prd": "docs/prd/other", "version": "1.0.0"}` and
#          `{"kind": "step", "step": 1, "env": "staging", "actor": "agent", "result": "fail"}`
#     SG3  write <tmp>/.gitignore with the line `CLAUDE.md`
#     SV0  load fixture repo/vendored into <tmp>/.prd-toolkit (lint_cli_support.load_vendored), then write
#          <tmp>/.prd-toolkit/HOMEPAGE with the line `https://example.com/toolkit`
#     SV1  after SV0: write <tmp>/.prd-toolkit/HOMEPAGE as the one byte `\n`, and <tmp>/.claude-plugin/plugin.json with
#          the line `{"name": "prd-toolkit", "homepage": "https://example.com/host"}`
#     SV2  after SV0: delete <tmp>/.prd-toolkit/HOMEPAGE
#     SB2  copy ORDERS to <tmp>/docs/prd/billing; in <tmp>/docs/prd/billing/prd.md the line `version: 1.0.0` becomes
#          `version: 0.2.0` and the line `The orders service imports order files and prints monthly reports.` becomes
#          `Billing sends invoices | credits. It runs nightly.`
#     SB3  write <tmp>/docs/prd/broken/prd.md as the four bytes ff fe 80 0a (hexadecimal): not UTF-8
#     SB4  copy ORDERS to <tmp>/docs/prd/my notes (a space in the name)
#     SB5  write <tmp>/docs/prd/notes/a.md with the line `x` (no prd.md), and copy ORDERS/prd.md to
#          <tmp>/docs/prd/.hidden/prd.md
#     SQ   move the folder ORDERS to <tmp>/docs/requirements/orders
#     SY   write <tmp>/real.md with the line `# Agents`, and create <tmp>/CLAUDE.md as a symbolic link to `real.md`
#     SMODE write ORDERS/README.md with the line `# Mine` and set its mode to 0o640
#     SF1  write <tmp>/CLAUDE.md with the seven lines `# Docs`, ``, "```", `<!-- prd-toolkit:start -->`, `example`,
#          `<!-- prd-toolkit:end -->` and "```"
#     SF2  write <tmp>/CLAUDE.md with the four lines `# D`, ``, "```" and `unclosed example`
#     SX1  write ORDERS/README.md with the three lines `<!-- prd-toolkit:start -->`, `<!-- prd-toolkit:start -->` and
#          `<!-- prd-toolkit:end -->`
#     SX2  write <tmp>/CLAUDE.md with the three lines `# Mine`, `<!-- prd-toolkit:start -->` and `half`
#     SX3  write <tmp>/CLAUDE.md with the two lines `<!-- prd-toolkit:end -->` and `<!-- prd-toolkit:start -->`
#     SR8  as SR6, with the Object or activity cell `a change to {{adopted_areas}}` in place of `a code change`
#     SS7  in prd.md the line `The orders service imports order files and prints monthly reports.` becomes
#          `See {{areas}} for the areas.`
#     SS8  in prd.md the line `The orders service imports order files and prints monthly reports.` becomes
#          `Prints {{homepage}} as text.`
#     SS9  in prd.md the line `The orders service imports order files and prints monthly reports.` becomes
#          `Intro <!-- note --> text`
#   Assertions: testing.md (Harness, Assertions) and its status paragraph (Setup steps), which defines
#   `status_items_json`, the `{file, …}` effects and `call:`.
#   CLAUDE_BASE, README_BASE and PARENT_V are the texts T-235.1, T-241.1 and T-242.1 give. H is the string at the
#   key `homepage` of <repo>/prd-toolkit/.claude-plugin/plugin.json without the white space at its ends (AC-243.2;
#   this repository's manifest is named `prd-toolkit` and holds a non-empty homepage, and a test that finds otherwise
#   ends as an error, not a failure, since the case's precondition does not hold), and PARENT_P is PARENT_V with
#   `https://example.com/toolkit` replaced by H.
#   A `call:` runs in the test process with prd-toolkit/scripts on sys.path; F = prdlint.overview.facts(prdlint.model.load(ORDERS)),
#   with ORDERS a pathlib.Path.

