# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below (they extend those of lint-cli.yaml and lint-structure.yaml):
#   <repo> is the repository root; <tmp> is the test's own tmp_path; <P> is <tmp>/docs/prd/orders.
#   S0 = write each entry of fixture lint-cli/orders (contracts/fixtures/lint-cli/orders.yaml) to <P>/<key>, creating
#   parent folders, and set PRD_PLUGINS_FILE to the absolute path of fixture lint-cli/plugins_superpowers.json.
#   With S0 alone the folder lints clean (T-001.1).
#   A file named in a setup step is relative to <P>. "line N of F" is line N of F as S0 wrote it, before any other
#   step of the case; "replace line N of F with X" keeps every other line; "insert X before line N of F" makes X line N;
#   "insert X after line N of F" makes X line N+1; "append X to F" adds each line of X, each with a newline, after F's
#   final newline. Several inserted or appended lines are listed in order. "delete line N of F" removes that line, and the
#   lines after it move up. "write F with the one line X" creates F holding X and a newline. A step that does not find
#   the file or the line it names ends the test as an error, not a failure, since the state the case needs was never built.
#   A2 = write <P>/adoption.md as the lines "# Adoption map", "", "| Area | State | Boundary |", "|---|---|---|",
#        "| import | adopted | `features/import.md` |", "| ghost | extracted | `src/ghost/**` |",
#        "| spare | confirmed | `src/spare/**` |", "| later | not started | |", each ending in a newline
#        (rows at lines 5 to 8).
#   A case whose output has no exit key does not assert the exit code: other rules may report its edits.
#   "texts.<key>" (a whole value) stands for the string, or the list of strings, under <key> in fixture lint-ids/texts
#   (contracts/fixtures/lint-ids/texts.yaml, read with yaml.safe_load). Texts that a lint of this PRD folder would itself
#   report live there, because lint never reads fixture data. A line a step writes from texts has no backticks around it; a list under texts gives one line per item.
#   R3 = replace line 105 of prd.md with "| FR-003 | Delete an order | removed | features/api.md | 1.0.0 |" and
#        replace line 22 of features/api.md with "Status: removed" (FR-003 removed in both places).
