  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0, replace line 19 of features/api.md with texts.traces_line]
    cwd: <tmp>
    command: python <repo>/prd-toolkit/scripts/prd_lint.py docs/prd/orders
  expect:
    output: {exit: 1, stdout_contains_line: texts.traces_expect, stderr: ""}
    effects: []
    errors: []
    leaks: none
