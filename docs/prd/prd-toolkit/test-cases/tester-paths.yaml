    - TP1
    - TP2
    cwd: "<tmp>"
    runs:
    - python CHECK docs/prd/orders --diff base..HEAD
    note: "TP4 makes checks/ the one test root and moves the tag base to its own commit, so the range holds TP1 and TP2 only: checks/test_a.py now lies under a test root and tests/test_orders.py under none"
  expect:
    output:
      each_run:
        exit: 1
        stdout_exact_lines:
        - "checks/test_a.py cites T-004.1, a tester's test: the builder may not edit it"
