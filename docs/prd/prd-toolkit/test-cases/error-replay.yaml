# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below:
#   <repo> is the repository root; <tmp> is the test's own tmp_path. The scratch repository is <tmp>/repo, which
#   the error-replay steps build from fixture status-next/base (testing.md, Setup steps); its PRD folder is
#   docs/prd/orders. "python" is the interpreter running the tests (sys.executable); every run is a subprocess
#   with the environment the error-replay steps give (TMPDIR=<tmp>/scratch, the runner's git config shut out),
#   and the case's cwd as its working directory.
#   ERROR = <repo>/prd-toolkit/scripts/prd_error.py, LINT = <repo>/prd-toolkit/scripts/prd_lint.py,
#   HELP = <repo>/prd-toolkit/scripts/prd_help.py.
#   input.resolution is the Resolution line steps RE and REU write. <bug>, <test>, <fix>, <merge>, <many>,
#   FULL(<rev>) and HEAD7 are as the error-replay steps define them, taken after the case's last step, and are
#   replaced the same way in the commands and in every expected value.
#   LEFT_AS_IT_WAS for a run is the effect: `git worktree list --porcelain` and `git status --porcelain`, each
#   run by the test in <tmp>/repo just before and just after that run, print the same text both times, and
#   <tmp>/scratch holds no entry after it.
#   The scratch PRD's level integration runs one test with `python3 tools/one.py`, slow with
#   `python3 tools/slow.py` and a Timeout of 2 seconds; system is a deploy-gate level; unit has an empty cell.

T-075.1:
  ac: AC-075.1
  level: integration
  target: "cli:prd_error"
  environment: local
  identity: none
  preconditions:
  - status-next/base
  - error-replay/files
  refs:
  - "testing.md#Setup steps"
  input:
    setup: [R0, RT, RF, RL, RQ, RE]
    resolution: "fixed in <fix>, red run tests/test_total.py [integration]"
    cwd: "<tmp>/repo"
    runs:
    - python ERROR replay docs/prd/orders E-001
    note: "RQ writes the column's header ONE TEST and the cell `python3 \"tools/one.py\"`: the header is found in any letter case, and the quotes group a word and are removed"
  expect:
    output:
      each_run:
        exit: 0
        stdout: "E-001: tests/test_total.py fails on <fix>^ and passes on <fix>\n"
        stderr: ""
    effects:
    - "LEFT_AS_IT_WAS for run_1"
    errors: []
    leaks: none

