# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Conventions for every case below: those of lint-registries.yaml (<repo>, <tmp>, <P>, S0, LINT, HELP, the setup steps,
#   runs and before:, the Subprocess environment, notes in parentheses about spaces or line numbers), and these:
#   "texts.<key>" stands for the value at <key> of fixture lint-testcases/texts (contracts/fixtures/lint-testcases/texts.yaml,
#   read with yaml.safe_load): a string, or a list of strings, one line each. "replace line N of F with texts.<key>" puts
#   its lines in place of line N; "insert texts.<key> after line N of F" puts its lines right after line N; "write F with
#   the lines texts.<key>" writes its lines. "delete lines N to M of F" deletes each line from N to M.
#   In a setup step, as in lint-registries.yaml, "line N of F" is the line as S0 wrote it, before any other step of the
#   case, also when an earlier step of the same case added or deleted lines of F; a before: step counts the lines of F
#   as the file stands when the step runs.
#   Every setup step, every before: step and every run of a case happens in the test's pytest fixture, and the test's
#   body only asserts, so a before: step that does not find its file or line also ends the test as an error.
#   A "Pack:" line whose source is (prd-toolkit) resolves to the toolkit's own pack, <repo>/prd-toolkit/packs/<name>/:
#   <tmp> holds no .prd-toolkit/ folder and LINT runs the plugin's script. The pack document 1.0.0 gives the target
#   kind doc and the contract type outline.
#   The texts hold every value a lint of this PRD folder would itself report, such as real-looking personal data in an input.
#   A finding line in expect names the line as the file stands after every step of its run.
#   The tests' helpers are defined in this area's own support file, lint_testcases_support.py (testing.md, Layout); the
#   tests import nothing from another area's support file.
T-149.1:
  ac: AC-149.1
  level: integration
  target: cli:prd_lint
  environment: local
  identity: none
  preconditions: [lint-cli/orders, lint-cli/plugins_superpowers]
  input:
    setup: [S0, "replace line 19 of test-cases/api.yaml with   ac: AC-002.1 (two spaces before ac)"]
    cwd: <tmp>
    command: LINT
  expect:
    output:
      exit: 1
      stdout_contains_line: "docs/prd/orders/features/api.md:16: ac-has-test: AC-002.2 has no test case whose ac: is AC-002.2"
      stderr: ""
    effects: []
    errors: []
    leaks: none
