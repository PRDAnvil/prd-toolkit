# Fixture practices/texts: the whole texts the practices Setup steps write (testing.md, Setup steps); one key per
# text. format: a practices.md with the fixture's rows (practices/repo) on the same lines, whose cells test how the
# loader reads them: a renamed header row (line 5), backticked and padded cells (line 7), a seventh cell (line 8),
# backticked Source and Applies to cells and a Practice cell with a `|` inside backticks (line 14), and a row with
# no Practice cell (line 16).
format: |
