  | errors | `contracts/errors.yaml` | built-in |

  ## 8. Adoption map

  See adoption.md.

  ## 9. Versioning

  - Breaking: removing a report line or an exit code.

  ## 10. Design & UI

  Not applicable: the service has no user interface.

