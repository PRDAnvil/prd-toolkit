plug/prd-packs/leaflet/pack.yaml: |
  pack: leaflet
  version: 0.1.0
  toolkit: ">=0.8.0,<0.9"
  description: Small static leaflet sites, written from the north and south PRDs.
  contract-types:
    - {type: pages, files: contracts/pages.yaml, validator: 'python3 -c "import sys; sys.exit(any(not open(f).readline().rstrip().endswith(chr(58)) for f in sys.argv[1:]))"'}
    - {type: routes, files: contracts/routes.yaml, validator: 'python3 -c "import sys; sys.exit(any(len(open(f).readlines()) < 2 for f in sys.argv[1:]))"'}
  levels:
    - {level: unit, command: "python3 -m pytest tests/unit", environment: local, gate: build}
  harness:
    Database access: "Not applicable: no database."
  standards:
    - {object: "site/**/*.html", linter: "python3 tools/check_html.py"}
  skills:
    - {activity: a change to a page, skill: code-review}
  vocabulary: []
plug/prd-packs/leaflet/README.md: |
  # leaflet

  A pack for small static leaflet sites, written from two adopted PRDs (north and south).

  - contract-types pages and routes: both PRDs, section 7.
  - levels unit, standards and skills: both PRDs.

  Samples: `samples/<type>/bad.yaml` is a copy of a real contract file broken in one named way.

  To do: the harness helpers, the clarify questions and a skill for this kind.
plug/prd-packs/leaflet/samples/pages/bad.yaml: |
  home path site/index.html
plug/prd-packs/leaflet/samples/routes/bad.yaml: |
  old-home: /
