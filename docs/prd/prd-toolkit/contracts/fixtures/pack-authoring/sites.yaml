      leaks: none

  T-001.2:
    ac: AC-001.2
    level: integration
    target: pages:home
    environment: local
    identity: none
    preconditions: []
    input: {path: "/nothing"}
    expect:
      output: {status: 404}
      effects: []
      errors: [PAGE_MISSING]
      leaks: none

  T-002.1:
