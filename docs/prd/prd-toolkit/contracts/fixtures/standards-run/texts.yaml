# Fixture standards-run/texts: the texts the standards-run setup steps write and the cases compare, one key per
# text. rows: the three lines of the section 5 table (header, separator, the enforced row with the glob `**/*.py`
# and the linter); linter: that row's linter command, which appends the paths it is given, joined by spaces, as
# one line to lint.log in its working directory, prints on stderr each path that holds `.prd-toolkit/` or ends
# in `bad.py`, and exits 1 when there is one; job_line: the command the generated CI gives the row's job
# (AC-068.4); old_job_line: the command a release before standards-run gave it. The FR-264 keys: none_row,
# changed_row and bogus_row: the enforced row with the span `files: none`, `files: changed` or `files: sometimes`
# after the linter's span; failing_linter: a linter that prints `whole tree refused` on stderr and exits 3;
# failing_none_row: the row with that linter and `files: none`; none_job_line, changed_job_gitlab and
# changed_job_github: the commands the generated CI gives a `none` row's job (AC-264.2) and a `changed` row's
# job in each forge's file (AC-264.3).
rows:
- '| Object (glob) | Linter command | Rules live in | Applies to | Decision |'
- '|---|---|---|---|---|'
- '| `**/*.py` | `python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"` | the command itself | every Python file | enforced |'
linter: python3 -c "import sys; open('lint.log', 'a').write(' '.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if '.prd-toolkit/' in a or a.endswith('bad.py')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"
job_line: git ls-files -z --format='./%(path)' -- ':(glob)**/*.py' ':(exclude).prd-toolkit' | xargs -0 -r python3 -c "import sys; open('lint.log', 'a').write(' '.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if '.prd-toolkit/' in a or a.endswith('bad.py')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"
old_job_line: git ls-files -z --format='./%(path)' -- ':(glob)**/*.py' | xargs -0 -r python3 -c "import sys; open('lint.log', 'a').write(' '.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if '.prd-toolkit/' in a or a.endswith('bad.py')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"
none_row: '| `**/*.py` | `python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"` `files: none` | the command itself | every Python file | enforced |'
changed_row: '| `**/*.py` | `python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"` `files: changed` | the command itself | every Python file | enforced |'
bogus_row: '| `**/*.py` | `python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"` `files: sometimes` | the command itself | every Python file | enforced |'
failing_linter: 'python3 -c "import sys; print(''whole tree refused'', file=sys.stderr); sys.exit(3)"'
failing_none_row: '| `**/*.py` | `python3 -c "import sys; print(''whole tree refused'', file=sys.stderr); sys.exit(3)"` `files: none` | the command itself | every Python file | enforced |'
none_job_line: 'if [ -n "$(git ls-files -- '':(glob)**/*.py'' '':(exclude).prd-toolkit'')" ]; then python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"; fi'
changed_job_gitlab: 'git diff -z --name-only --diff-filter=d --line-prefix=./ $CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD -- '':(glob)**/*.py'' '':(exclude).prd-toolkit'' | xargs -0 -r python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"'
changed_job_github: 'git diff -z --name-only --diff-filter=d --line-prefix=./ ${{ github.event.pull_request.base.sha }}...HEAD -- '':(glob)**/*.py'' '':(exclude).prd-toolkit'' | xargs -0 -r python3 -c "import sys; open(''lint.log'', ''a'').write('' ''.join(sys.argv[1:]) + chr(10)); bad = [a for a in sys.argv[1:] if ''.prd-toolkit/'' in a or a.endswith(''bad.py'')]; print(*bad, file=sys.stderr); sys.exit(1 if bad else 0)"'
