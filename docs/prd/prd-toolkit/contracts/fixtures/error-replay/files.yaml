# docs/prd/orders/testing.md: status-next/base's testing.md with Levels on lines 5 to 11: integration runs
# one test with tools/one.py, slow with tools/slow.py and a Timeout of 2 seconds, system is a deploy-gate
# level, and unit and judged have an empty One test cell.
testing: |
  # Testing

  ## Levels

  | Level | Harness command | Environment | Gate | One test | Timeout |
  |---|---|---|---|---|---|
  | unit | `pytest tests/unit` | local | build |  |  |
  | integration | `pytest tests/integration` | local | build | `python3 tools/one.py` |  |
  | judged | `pytest tests/judged` | local | build |  |  |
  | slow | `pytest tests/slow` | local | build | `python3 tools/slow.py` | 2 |
  | system | `pytest tests/system` | staging | deploy | `python3 tools/one.py` |  |

  ## Harness

  - **Lifecycle.** Nothing runs between tests; each test runs the importer or the report command itself.
  - **Environment switch.** Not applicable: one test environment, `local`.
  - **Database access.** Not applicable: no database.
  - **Tools on the runner.** python3 on PATH; `tests/` sits at the repository root.
  - **Clean state.** Every test starts from its own temporary directory.
  - **Persistent environments.** Not applicable: no test environment keeps data.
  - **Layout.** `tests/<level>/test_<area>.py`; each test's docstring cites its T-id, e.g. `@prd T-001.1`. Test roots: `tests/`
  - **HTTP requests.** Not applicable: no HTTP API.
  - **Fixtures.** Not applicable: the cases give their input inline.
  - **Browser identity.** Not applicable: no user interface.
  - **Assertions.** Fields a case does not list are not asserted.
  - **Waits.** Not applicable: every command runs to completion first.
  - **Effects.** Not applicable: the cases assert output only.
  - **Leaks.** Not applicable: no classified data.
  - **Acceptance.** Not applicable: no acceptance level.

  ## Environments

  | Environment | Purpose | Access | Base URL | Database | Logs |
  |---|---|---|---|---|---|
  | local | a developer's checkout | anyone with a clone | none | none | the command's output |
  | staging | the service before release | the team | https://orders-staging.example.com | none | `./deploy.sh staging --logs` |
  | production | the live service | the team | https://orders.example.com | none | `./deploy.sh production --logs` |

  ## Leak checks

  | Sink | Read from | Scanned for |
  |---|---|---|
  | command output | the test captures stdout and stderr | nothing: no classified data |

  ## Fixtures

  | Fixture | Creates | Load | Teardown |
  |---|---|---|---|

  ## Sign-offs

  | T-id | Owner | Date | Result |
  |---|---|---|---|

