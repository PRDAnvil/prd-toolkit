# .gitignore: the file tools/needs.py looks for, and Python's byte-code folders.
gitignore: |
  .ready
  __pycache__/

# tools/one.py: runs the file it is given with the interpreter that runs it, and exits with that file's status.
one_py: |
  import subprocess
  import sys

  sys.exit(subprocess.run([sys.executable, sys.argv[1]]).returncode)

# tools/slow.py: writes its process ID to the file ONE_STARTED names, when that is set, then sleeps 30 seconds
# and exits 0, whatever it is given.
slow_py: |
  import os
  import time

  started = os.environ.get("ONE_STARTED")
  if started:
      with open(started, "w") as f:
          f.write(str(os.getpid()))
  time.sleep(30)

# tools/needs.py: tools/one.py for a checkout that holds the file .ready, which .gitignore keeps out of every
# commit; without it, it exits 3: a harness that cannot run in a fresh checkout.
needs_py: |
  import os
  import subprocess
  import sys

  if not os.path.exists(".ready"):
      sys.exit(3)
  sys.exit(subprocess.run([sys.executable, sys.argv[1]]).returncode)

# src/importer.py: a file of the adopted area import.
importer: |
  x = 1

# src/calc.py with the bug: the total leaves out the first value.
calc_bug: |
  def total(values):
      return sum(values[1:])

# src/calc.py fixed.
calc_fix: |
  def total(values):
      return sum(values)

# src/calc.py changed, and still wrong: a fix that does not fix.
calc_still: |
  def total(values):
      return sum(values[2:])

# A test that cites T-006.1 and fails on calc_bug (the total of 1, 2 and 3 is 5) and on calc_still, and passes
# on calc_fix; it exits 0 when it passes and 1 when it fails.
test_total: |
  # @prd T-006.1
  import sys

  sys.path.insert(0, "src")
  import calc

  sys.exit(0 if calc.total([1, 2, 3]) == 6 else 1)

# A test that cites T-006.1 and passes on calc_bug and on calc_fix alike.
test_pass: |
  # @prd T-006.1
  import sys

  sys.path.insert(0, "src")
  import calc

  sys.exit(0 if calc.total([]) == 0 else 1)

# A test that cites T-006.1, passes on calc_bug and fails on calc_fix.
test_inv: |
  # @prd T-006.1
  import sys

  sys.path.insert(0, "src")
  import calc

  sys.exit(0 if calc.total([1, 2, 3]) == 5 else 1)

# A later test file that cites nothing and fails on every tree.
test_later: |
  import sys

  sys.exit(1)

