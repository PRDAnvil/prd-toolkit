     Run: `./deploy.sh staging`
     Check: `./deploy.sh staging --status` prints `ok`
  2. Approve production (actor: human) (env: production)
     Do: read the staging result and reply "deploy production"
     Check: the reply says "deploy production"
  3. Deploy to production (actor: agent) (env: production)
     Run: `./deploy.sh production`
     Check: `./deploy.sh production --status` prints `ok`
