docs/prd/orders/features/import.md: |
  # Import

  ### FR-001 Refuse a file with no header
  Status: approved
  Acceptance (EARS):
  - AC-001.1 If the import file has no header line, the importer shall exit 2 with error IMPORT_NO_HEADER.
  Errors: IMPORT_NO_HEADER (contracts/errors.yaml)
  Tests: T-001.1 [integration]  (test-cases/import.yaml)

  ### FR-002 Skip a duplicate order
  Status: built
  Acceptance (EARS):
  - AC-002.1 When an imported row's order key already exists, the importer shall skip the row.
  Errors: -
  Tests: T-002.1 [integration]  (test-cases/import.yaml)

  ### FR-003 Store a new order
  Status: verified
  Acceptance (EARS):
  - AC-003.1 When an imported row has a new order key, the importer shall store the row.
  Errors: -
  Tests: T-003.1 [integration]  (test-cases/import.yaml)

  ### FR-004 Count the imported rows
  Status: live (since 1.0.0)
  Acceptance (EARS):
  - AC-004.1 When an import ends, the importer shall print the number of rows it stored.
  Errors: -
  Tests: T-004.1 [integration]  (test-cases/import.yaml)
docs/prd/orders/features/reports.md: |
  # Reports

  ### FR-005 Print the monthly report
  Status: approved
  Acceptance (EARS):
  - AC-005.1 When asked for a month, the report command shall print one line per order of that month.
  Errors: -
  Tests: T-005.1 [integration], T-005.2 [judged]  (test-cases/reports.yaml)

  ### FR-006 Total the monthly report
  Status: live (since 1.0.0)
  Acceptance (EARS):
  - AC-006.1 When it prints a monthly report, the report command shall end it with the month's total.
  Errors: -
  Tests: T-006.1 [integration]  (test-cases/reports.yaml)

  ### FR-007 Refuse an unknown month
  Status: live (since 1.0.0)
  Acceptance (EARS):
  - AC-007.1 If the month has no orders, the report command shall print nothing and exit 1.
  Errors: -
  Tests: T-007.1 [integration]  (test-cases/reports.yaml)
