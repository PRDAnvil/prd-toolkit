    hook_left_alone: "stdout: <hooks>/<hook> already exists and was left alone; add this line to <hooks>/<hook> (an sh hook; place it before any `exit 0` in it): <hook line> | …; replace its uv run --script … prd_git_hook.py line in <hooks>/<hook> with this line: <hook line> (FR-102)"
    refreshed: "stdout, from the plugin, after the hook lines: refreshed <path>, one per managed-block file changed: CLAUDE.md, <prd>/README.md, then the parent README.md (FR-104)"
    stale_ci: "stdout, last lines: stale: <CI file>: re-run prd_hooks.py ci --<forge> --force, the GitLab file first (FR-105)"
    pack_refused: "stderr: prd_hooks: install refused: pack <name> <X.Y.Z> (<source>) not found; looked in: <places>[; to move the PRD to <name> <have>, run prd_change.py pack <prd> <name> <have>] (FR-099)"
    blocks_refused: "stderr: prd_hooks: install refused: <file>: <problem>; fix the marker, then run prd_block.py <prd> (FR-104)"
  hook_line: 'prd_top="$(git rev-parse --show-toplevel)" || exit 1; if [ -f "$prd_top/.prd-toolkit/prd_git_hook.py" ] && [ ! -f "$prd_top/.prd-toolkit/prd" ]; then echo "prd-toolkit: .prd-toolkit/ on this branch predates 0.8.8 (no .prd-toolkit/prd); hook skipped" >&2; elif [ -f "$prd_top/.prd-toolkit/prd_git_hook.py" ] && [ -f "$prd_top/.prd-toolkit/prd" ] && [ -d "$prd_top/<prd>" ]; then command -v uv >/dev/null 2>&1 || { echo "prd-toolkit: uv is not on PATH; install uv to run this hook" >&2; exit 1; }; sh "$prd_top/.prd-toolkit/prd" git-hook <hook> "$prd_top/<prd>" "$@" || exit $?; else echo "prd-toolkit: no .prd-toolkit/ (or no PRD folder) on this branch; hook skipped" >&2; fi (FR-102, FR-103)'
  vendored_files: ".prd-toolkit/: the 22 files of AC-098.1's first list, prdlint/**, hooks/{commit-msg,pre-commit}, templates/{claude-block.md,readme-prd.md,readme-prds.md}, confirm/{form.html,panel.html}, gates/inbox.html, judge/**, languages/*.yaml, help.yaml, LICENSE, packs/<name>/, pack-sources.json, VERSION, HOMEPAGE (when the plugin has a homepage), .gitignore (FR-098, FR-099)"
  gitignore_lines: ".gitignore at the top gains .prd-judge/ and .prd-review.json, each once (FR-100)"
