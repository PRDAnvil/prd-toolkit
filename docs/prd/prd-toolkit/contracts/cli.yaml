  errors_stderr:
    not_a_prd: "prd_build_check: <loader's message> (FR-188)"
    unmigrated: "prd_build_check: <folder>/prd.md: section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; move the table there and leave \"See adoption.md.\" (FR-188)"
    bad_range: "prd_build_check: bad range <value>: expected <base>..<head> | prd_build_check: bad range <value>: <end> is not a commit (FR-189)"
    vendor_failed: "prd_build_check: vendor at <first 12 characters of the head SHA>: <first line> (FR-192)"
    not_in_git: "prd_build_check: <folder> is not in a git working tree, --stale only (FR-196)"
    timeout: "prd_build_check: <git <subcommand> | vendor> timed out after 120 s (FR-197)"
    unreadable_input: "one line starting prd_build_check: , for a --results or --sources file that is missing or not UTF-8 (FR-198)"
  exit_codes:
    0: "no finding; --help"
    1: "at least one finding line on stdout"
    2: "usage, a missing package (FR-187), a PRD folder that cannot be loaded, a bad range, --stale outside git, a failed vendor run, a timeout, an unreadable input file or an internal error"
prd_launcher:
  # The sh launcher prd-toolkit/scripts/prd and its vendored copy .prd-toolkit/prd, the same file (launcher, FR-069).
  invocation: "prd-toolkit/scripts/prd <command> [arguments], or .prd-toolkit/prd <command> [arguments]; prd --version prints the toolkit's version"
  find: "first: uv python find --system \">=3.11\", its stderr not shown (FR-069)"
  run: "then exec: uv run --quiet --no-project --project <here> --python <the path the find printed, or >=3.11 when it exited other than 0 or printed nothing> --with-requirements <req> python <here>/prd_dispatch.py <command> [arguments] (FR-069)"
  output:
    no_uv: "stderr: prd: uv is not on PATH; install uv"
  exit_codes:
    2: "uv is not on PATH"
    other: "the exit code of the uv run line, which is the command's"
prd_context:
  invocation: "uv run --script prd-toolkit/scripts/prd_context.py [--area AREA] [--req ID[,ID...]] [--for {decide,implement}] [--context N] [--json] [--interface] [prd_dir]; through the launcher, prd context"
  implement_parts: "Header, Stack, Glossary, Requirements, Code, Practices, Levels, Harness defaults, Rubric conventions, Cited, Upstream contracts, Known defects, Open questions, History; a part with nothing to hold is left out or holds None. as before; Practices only when the PRD folder holds practices.md, holding None. when no code practice matches, and with no practices.md the pack is unchanged (FR-055)"
  practices_item: "text: <id> (<source>): <practice>, one item per matching code practice; JSON: a parts entry {\"title\": \"Practices\", \"id\", \"file\": \"practices.md\", \"line\", \"text\", \"stale\": false, \"counted\": true, \"moved\": null} (FR-055)"
  json_document: 'stdout, --json: one line, {"interface": 1, "kind": "context", "prd", "mode", "area", "ids", "parts": [<part entry>, …]}, the parts in the text pack''s order (FR-055)'
  area_notes_part: "with --area, in either mode: the part Area notes, directly before Requirements, when the area's features file holds area notes (features/context-notes.md); text: ## Area notes, an empty line, the notes' lines, an empty line; JSON: a parts entry {\"title\": \"Area notes\", \"id\": null, \"file\": \"features/<area>.md\", \"line\", \"text\", \"stale\": false, \"counted\": true, \"moved\": null}; with no area notes the pack is as before (FR-072)"
  arguments:
    prd_dir: "the PRD folder; required unless --interface or --help is given (FR-199)"
    --area: "an area: an adoption.md row's area or features/<area>.md; omitted, the repository pack (FR-201, FR-203)"
    --req: "comma-separated UJ, FR, NFR or E IDs, upper-cased and stripped; needs --area (FR-201, FR-206, FR-207)"
    --for: "decide (the default) or implement; implement needs --area and a git work tree (FR-201, FR-220)"
    --context: "integer >= 0, default 20: code lines either side of a cited line (FR-199, FR-215)"
    --json: "print one JSON document; --json=1 is the same, any other --json=N is refused (FR-200, FR-221)"
    --interface: "print the interface number 1; no folder is read and no --json=N is checked (FR-200)"
    "-h, --help": "print the help to stdout (FR-199)"
  output:
    part: "stdout: ## <part>, an empty line, the items separated by an empty line (Areas: none), an empty line before the next part (FR-220)"
    decide_parts: "Header, Stack, Glossary, Area notes, Requirements, Cited, Upstream contracts, Known defects, Open questions, History; a part with nothing to hold is left out or holds None. (FR-220)"
    repo_parts: "Header, Stack, Areas (FR-203)"
    header_prd_line: "PRD: <folder> version <version> mode <mode> (FR-203, FR-204)"
    header_area_line: "Area: <area> (<state>; Boundary: <globs>) | (<state>) | (-) (FR-204)"
    header_size_line: "pack <n> bytes (~<k>k tokens, bytes / 4); prd.md <n>[; features/<area>.md <n>] (FR-204)"
    areas_line: "- <area> (<state>; Boundary: <globs>) | - <area> (<state>) | - <slug> (FR-203)"
    cited_missing_code: "<CODE>: not in contracts/errors.yaml (FR-210)"
    upstream_missing: "<kind>:<prd>/<name>: not in the snapshot (FR-211)"
    defects_count: "<n> open errors.md entries name no requirement (FR-212)"
    questions_count: "<n> other open questions in prd.md §13 (FR-213)"
    code_heading: "### <path>:<line> @<sha> (FR-215)"
    code_line: "<line number right-aligned in 5 columns>  <text> (FR-215)"
    code_bad_source: "### <ID> Source: <value>, then STALE: Source not in <path>:<line> @<sha> form (FR-215)"
    moved: "MOVED: line <L> is now line <M> (FR-216)"
    stale: "STALE: unknown commit <sha> | file missing | <path> is not in <sha> | line <L> is past the end (<n> lines) | the cited line's text is gone | the cited line's text appears <n> times | changed since <sha>; the cited line may have moved | uncommitted changes; the cited line may have moved | cannot compare with <sha>; the cited line may have moved, each followed by ' (pulled in; not counted)' for a block not counted (FR-216, FR-217)"
    harness_line: "- **<slot>.** <text> (FR-219)"
    json_part_entry: '{"title", "id", "file", "line", "text", "stale", "counted", "moved"} (FR-221)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "context", "error": <message>} (FR-202)'
    interface: "stdout, --interface: 1 (FR-200)"
    unsupported_interface: "stderr: prd_context: unsupported interface <N>; this toolkit speaks 1 (FR-200)"
    usage: "stderr: argparse's usage, its first line starting usage: prd_context.py (FR-199)"
    argparse_error: "stderr: usage, then prd_context.py: error: <argparse message> (FR-199)"
    negative_context: "stderr: prd_context: --context must be 0 or more (FR-199)"
    not_a_prd: "stderr: prd_context: <resolved folder>: no prd.md, optionally followed by ; found <name>; the file name is lowercase prd.md (FR-199)"
    internal_error: "stderr: prd_context: internal error: <exception type>: <message> (FR-199)"
    unmigrated: 'stderr: prd_context: <resolved folder>/prd.md: section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; move the table there and leave "See adoption.md." (FR-201)'
    req_needs_area: "stderr: prd_context: --req needs --area (FR-201)"
    implement_needs_area: "stderr: prd_context: --for implement needs --area (FR-201)"
    req_empty: "stderr: prd_context: --req names no ID (FR-201)"
    unknown_area: "stderr: prd_context: unknown area '<area>'; areas: <areas> | none (FR-201)"
    no_work_tree: "stderr: prd_context: --for implement needs the PRD inside a git work tree (FR-201)"
    unknown_ids: "stderr: prd_context: no requirement block defines <IDs>[; pass the requirement ID (<owners>), not <ID>]…[; errors.md has no entry <E-IDs>] (FR-201)"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script"
  exit_codes:
    0: "pack printed with no stale Code item of a counted block; --interface; --help (FR-217, FR-200, FR-199)"
    1: "pack printed with a stale Code item of a counted block (FR-217)"
    2: "usage or input error, nothing on stdout (with --json, the error document) (FR-199, FR-200, FR-201, FR-202)"
