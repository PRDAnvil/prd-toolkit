    file_extra: "stdout: .prd-toolkit/<path> is not in the plugin (FR-108)"
    hook_user_old_line: "stdout: stale: <hooks>/<hook>; replace its uv run --script … prd_git_hook.py line with the line prd_hooks.py install prints (FR-109)"
    pack_missing: "stdout: packs/<name>: missing; source <source> <version>; run prd_hooks.py install (FR-110)"
    pack_differs: "stdout: packs/<name>: differs from <source> <version>; run prd_hooks.py install (FR-110)"
    pack_source: "stdout: packs/<name>: vendored from <recorded or an unrecorded source>, the PRD names <source>; run prd_hooks.py install (FR-110)"
    block_stale: "stdout, check and check --ci: stale: <file>; run prd_block.py <prd> (FR-111)"
    block_broken: "stdout, check and check --ci: stale: <file>: <problem>; run prd_block.py <prd> (FR-111)"
    not_a_checkout: "stderr, check --ci: prd_hooks: <prd folder> is not inside a git checkout (FR-111)"
  uninstall_output:
    removed: "stdout: removed <hooks>/<hook> (FR-112)"
  ci_output:
    include: "stdout, ci --gitlab, after wrote: include: '.gitlab/prd-toolkit.yml' (FR-113)"
    differs: "stdout: the unified diff (--- <file> (existing), +++ <file> (generated)), then <file> exists and differs; rerun with --force to overwrite it (FR-113)"
    predates: "stderr: prd_hooks: .prd-toolkit/ predates 0.8.8 (no .prd-toolkit/prd); run prd_hooks.py install <prd_dir> first (FR-113)"
  ci_files:
    github: ".github/workflows/prd-toolkit.yml (FR-113, FR-117)"
    gitlab: ".gitlab/prd-toolkit.yml (FR-113, FR-116)"
  ci_jobs:
