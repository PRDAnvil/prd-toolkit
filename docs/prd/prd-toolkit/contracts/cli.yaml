    from_copy: "stderr: prd_hooks: vendor runs from the plugin, not from .prd-toolkit/ (FR-107)"
    refused: "stderr: prd_hooks: vendor refused: <reason>, the reason as install_output.pack_refused gives it (FR-107)"
