# The custom contract type `cli` (prd.md §7): one top-level key per CLI script, each with its
# arguments, its output lines and its exit codes. Test cases target a script as `cli:<key>`.
prd_lint:
  invocation: "uv run --script prd-toolkit/scripts/prd_lint.py [--list-rules] [--list-packs] [--ci] [--sample-tids N] [--json] [--interface] [prd_dir]"
  arguments:
    "prd_dir": "the PRD folder; required unless --list-rules, --list-packs or --interface is given (FR-004)"
    "--list-rules": "print every registered rule and its severity, sorted, one per line; the folder is not read (FR-003)"
    "--list-packs": "print every pack on this machine, the toolkit's own first; the folder is not read (FR-013)"
    "--ci": "set PRD_LINT_CI=1 before the rules run (FR-008)"
    "--sample-tids N": "integer >= 0; print up to N random non-unit test cases instead of linting (FR-007)"
    "--json": "print the lint result as one JSON document instead of the finding lines; --json=1 is the same, any other --json=N is refused (FR-014)"
    "--interface": "print the interface number 1; the folder is not read and a --json=N is not checked (FR-014)"
    "-h, --help": "print the help to stdout (FR-004)"
  output:
    finding: "stdout: <path>:<line>: <rule>: <message>, sorted by file, line, rule; <path> per FR-002"
    warn_finding: "stdout: <path>:<line>: warn: <rule>: <message>, sorted with the findings (FR-001)"
    rule_name: "stdout, --list-rules: <name> <severity> per line, the severity error or warn"
    pack: "stdout, --list-packs: <name> <version> (<source>), then ' — <description>' when the pack has one (FR-013)"
    vendored_note: "stderr, --list-packs from a vendored copy: prd_lint: listed from the vendored copy: <names> is/are vendored in .prd-toolkit/packs/, each with the source it was vendored from; the plugin's own scripts/prd_lint.py --list-packs lists every pack on this machine (FR-013)"
    sample: "stdout, --sample-tids: <T-id> <test-case file relative to the folder>"
    usage: "stderr: usage: prd_lint.py [-h] [--list-rules] [--list-packs] [--ci] [--sample-tids N] [--json] [--interface] [prd_dir], one line whatever the terminal width"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "lint", "prd", "version", "dir", "findings": [{"file", "line", "rule", "severity", "message"}], "errors", "warnings"} (FR-014)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "lint", "error": <message>} (FR-014)'
    interface: "stdout, --interface: 1 (FR-014)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_lint: unsupported interface <N>; this toolkit speaks 1 (FR-014)"
    argparse_error: "stderr: usage line, then prd_lint.py: error: <argparse message>"
    negative_sample: "stderr: prd_lint: --sample-tids N must be >= 0"
    not_a_prd: "stderr: prd_lint: <resolved folder>: no prd.md, optionally followed by ; found <name>; the file name is lowercase prd.md"
    internal_error: "stderr: prd_lint: internal error: <exception type>: <message>"
    rule_crash: "stderr: prd_lint: internal error in rule <rule>: <exception type>: <message>"
    no_sample: "stderr: prd_lint: no non-unit T-ids to sample"
    missing_package: "stderr: prd_lint: missing Python package '<package>'. Run with: uv run --script <script> …, or: pip install pyyaml sqlglot openapi-spec-validator"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-009)"
  exit_codes:
    0: "clean lint or only warnings, --list-rules, --list-packs, --interface, --help, or a sample printed"
    1: "one or more error findings, or --sample-tids with no non-unit test case"
    2: "usage error, an unsupported --json=N without --interface, folder without prd.md, missing dependency, or internal error (load or rule)"
  structure_findings:
    frontmatter: "prd.md: missing key '<key>' | '<key>: <value>' <reason> | missing key 'sql-dialect' (required because contracts/schema.sql exists) | 'sql-dialect: <value>' is not a sqlglot dialect (<sqlglot error>) (FR-020)"
    language-table: "prd.md: language '<code>' has no table, or the language loader's reason (FR-021)"
    sections_headings: "prd.md: missing section '## <n>. <title>' | sections are out of order | unexpected section '## <n>. <title>' (FR-022)"
    sections_files: "<entry>:0 mandatory '<entry>' is missing | mandatory '<entry>' cannot be marked not applicable | '<slot>' is absent and section 1 has no 'Not applicable: `<slot>` — reason' line (FR-023)"
    sections_adoption: "section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; ... | section 8 points at adoption.md but adoption.md does not exist | section 8 says \"Not applicable: new project\" but adoption.md exists | section 8 body must be \"See adoption.md.\" or \"Not applicable: new project.\" | adoption.md holds no '| Area | State | Boundary |' table | adoption.md table header must be '| Area | State | Boundary |', not '| <cells> |' | adoption state '<state>' for <area> must be one of not started, extracted, confirmed, adopted (FR-024)"
    sections_harness: "testing.md has no '## Harness' section with its slots | Harness slot '<slot>' is missing | Harness slots are out of order; the order is <the fifteen slots> | the Harness Layout slot has no 'Test roots:' text | Test roots: lists no backticked directory (FR-025)"
    placeholder: "placeholder '<text>' in prose; if this is literal text, put it in backticks | placeholder '<text>' in a YAML value (FR-027)"
    vague-word: "'<word>' with no measurable number on the line (FR-028)"
    markers-open: "the clarification marker's name in square brackets, then: left open while status is <status> (markers count in every text file, comments included; delete a template hint once its slot is answered) (FR-029)"
    assumption-indexed: "the word ASSUMPTION in square brackets, then: marker has no A-nn id | <A-id> has no row in section 12 | <A-id>: status '<status>' must be open, confirmed, corrected or awaiting <who> | <A-id> is open while the PRD is Approved (FR-030)"
    open-questions-empty: "section 13 must be 'None.' when the PRD is Approved (FR-031)"
    glossary-synonym: "'<text>' is a banned synonym; use '<term>' (FR-032)"
  registries_findings:
    registries_decision: "prd.md, at the row: standards Decision '<d>' is not one of enforced, declined, proposed | skills Decision '<d>' is not one of required, recommended, declined, proposed | standards row is still 'proposed' but the PRD is Approved | skills row is still 'proposed' but the PRD is Approved (FR-132)"
    registries_command: "prd.md, at the row: enforced standards row has no linter command ('<cell>'); put it in backticks | enforced linter command '<word>' is not on PATH (FR-133)"
    registries_skill: "prd.md, at the row: required skill '<skill>' is not installed; if it is built into Claude Code, mark the row 'recommended' (FR-134)"
    runbook-steps: "operations.md: step <n>: expected step <m> | step <n>: label <label> appears twice | step <n>: the step line needs (actor: agent|human) (env: <environment>), the first finding of the rule ending ' (prd-toolkit 0.5 runbook format)' for a 0.4 runbook (FR-135); step <n>: a human step takes Do: and Check:, not <labels> | step <n>: a human step needs Do: and Check: (FR-136); step <n>: an agent step takes Run:, Check: and Rollback:, not Do: | step <n>: an agent step needs Run: | step <n>: Run: must be one backticked command or tests <level>[, <level>]; got '<value>' | step <n>: an agent step needs Check: | step <n>: Check: must be one backticked command, optionally followed by prints `<text>`; got '<value>' | step <n>: Rollback: must be one backticked command; got '<value>' (FR-137); step <n>: a tests step names no levels | step <n>: a tests step has no Check: (FR-138)"
    runbook-env: "operations.md: environment '<env>' is in operations.md but not in testing.md Environments | environment '<env>': Production '<cell>' is not yes or no | operations.md Environments has no Production column | operations.md Environments: no environment has Production yes (FR-139); <prefix>environment '<env>' is not in operations.md Environments[ (did you mean '<name>'?)] | <prefix>environment '<env>' is not in testing.md Environments, <prefix> being 'step <n>: ', 'Deployed row: ' or 'Drift row: ' (FR-140)"
    production-gate: "operations.md, at the step: step <n> deploys <env> with no human step at or just before it (FR-141)"
    runbook-tests: "operations.md, at the Run: line: step <n>: level '<level>' is not in testing.md Levels | step <n>: level '<level>' has Gate <gate or none>; a tests step runs deploy-gate levels | step <n>: level '<level>' has no Harness command (FR-142)"
    drift-rows: "operations.md, at the row: check '<check>' is not version or config, `schema` included | a config drift row needs contracts/config.yaml (FR-143)"
    error-entries: "errors.md: <E-id> is the first entry: <missing> <tail> | <E-id> follows <E-id>: <missing> <tail> | <E-id> follows <E-id>: entries run from E-001 upward, newest last (FR-144); <E-id>: Classification: '<value>' is not one of code bug, spec gap, invalid requirement, environment, standard, unclassified | <E-id>: Evidence: is <n> lines; at most 20 (FR-145); <E-id>: Confirmed: must be '<YYYY-MM-DD>, \"<reply>\"' | <E-id>: Confirmed: on an unclassified entry (FR-146); <E-id>: Detected: must be \"<YYYY-MM-DD>, <source>\" | <E-id>: Recurrence of: <item> is not an entry (FR-147)"
  testcases_findings:
    ac-has-test: "features/*.md or nfr.md, at the AC: <AC-id> has no test case whose ac: is <AC-id> (FR-149)"
    test-cases-consistent: "at the Tests line: the Tests line of <block-id> names no test-cases file; end it with (test-cases/<area>.yaml) | <T-id>: the named file <file> does not exist | <T-id> has no entry in <file> | <T-id> is [<level>] on the Tests line but level: <level> in <file>:<line>; at the case: <T-id> is cited by no Tests line naming <file> (FR-150)"
    test-level: "testing.md: testing.md Levels: add a Gate column (build or deploy), new in prd-toolkit 0.4 | level '<level>': Gate '<gate>' is not one of build, deploy (FR-151) | level '<build>' (Gate build) would collect level '<deploy>' (Gate deploy) tests: <path> (FR-152); test-cases/*.yaml: <T-id> has no level | <T-id>: level '<level>' is not a row of the Levels table in testing.md (FR-153)"
    sufficiency: "test-cases/*.yaml: <T-id>: <key> is missing, <key> one of ac, level, environment, identity, target | <T-id>: target '<target>' must be <kind>:<name> | <T-id>: target kind '<kind>' is unknown (known: <kinds>) (FR-154); <T-id>: preconditions must be a list (use [] for none) | <T-id>: input is missing or empty | <T-id>: expect is missing | <T-id>: expect.output is missing | <T-id>: expect.effects must be a list (use [] for none) | <T-id>: expect.errors must be a list (use [] for none) | <T-id>: expect.leaks is missing (use 'none') (FR-155); <T-id>: an acceptance case needs steps: a non-empty list of strings | <T-id>: an acceptance case needs signoff: the business owner (FR-156)"
    judged-case: "test-cases/*.yaml: <T-id>: rubric must be a non-empty list of non-empty strings | <T-id>: rubric item <k> repeats item <j> | <T-id>: threshold must be a number in (0, 1] | <T-id>: runs must be an integer of at least 1 | <T-id>: a judged case has no expect.output (FR-157); warn: <T-id>: threshold <t> needs all <n> items (<n-1> of <n> is <v>); write <d> to allow one miss, or 1.0 (FR-158)"
    test-refs: "test-cases/*.yaml: <T-id>: <ac> is not an acceptance criterion in any requirement block | <T-id>: <ac> belongs to requirement <a>, but <T-id> is numbered for requirement <b> (FR-159); <T-id>: precondition <repr> must be a fixture name or mock:<service> | <T-id>: mock:<service> has no contracts/dependencies/<service>.yaml | <T-id>: fixture '<name>' is not in the Fixtures table of testing.md | <T-id>: fixture '<name>' has no file or directory at contracts/fixtures/<name> | <T-id>: input.file '<file>' does not exist under contracts/fixtures/ (FR-160); <T-id>: expect.errors item <repr> must be an error code string | <T-id>: error code <code> is not in contracts/errors.yaml | <T-id>: environment '<env>' is not in the Environments table of testing.md | <T-id>: identity '<identity>' is neither none nor a test identity in contracts/permissions.yaml (FR-161); <T-id>: refs entry <repr> must be a path in the PRD folder, optionally with #heading | <T-id>: refs entry '<entry>': no file <path> in the PRD folder | <T-id>: refs entry '<entry>': <path> has no heading '<heading>' (FR-162); <T-id>: known-failing <repr> must be an E-nnn entry of errors.md | <T-id>: known-failing <E-id> is resolved in errors.md; remove the line | <T-id>: symptom: needs known-failing: on the same case | warn: <T-id>: known-failing <E-id> names no symptom; any failure would pass as it (FR-163); <T-id>: target op:<name>: no operationId '<name>' in contracts/openapi.yaml | <T-id>: target table:<name>: no table '<name>' in contracts/schema.sql | <T-id>: target <kind>:<name>: no '### <name>' heading in contracts/events.md and no such asyncapi channel or operation | <T-id>: target <target>: contract type <type> has no §7 row (Validator pack) | <T-id>: target <target>: no <type> entry '<name>' | <T-id>: target <target>: '<name>' is not an item of the <kind> files (items: <items>) (FR-164)"
    deny-tested: "contracts/permissions.yaml, at the deny: line: deny cell (<operation>, <role>): role '<role>' has no test identity | deny cell (<operation>, <role>) has no test case with target op:<operation>, identity <identity> and expect.errors (FR-165)"
    classified-fixtures: "contracts/fixtures/**: <table>.<column> is classified pii but holds the real-looking value '<value>' (FR-166); test-cases/*.yaml, at input: <T-id>: inline input holds the real-looking PII value '<value>'; use a synthetic form (FR-167)"
  contracts_findings:
    contracts-valid: "contracts/openapi.yaml: openapi validation failed: <first line> (line 1) | <paths|webhooks> must be a mapping | <path>: must be a mapping | <METHOD> <path>: operation must be a mapping | <METHOD> <path>: missing operationId | <METHOD> <path>: x-prd-ids must be a non-empty list | <METHOD> <path>: x-prd-ids item <repr> is not a defined requirement or AC id | <METHOD> <path>: <x-error-codes|x-preconditions|x-effects> must be a list (use [] for none) (FR-170); <METHOD> <path>: responses must be a mapping | <METHOD> <path>: response <status> must be a mapping | <METHOD> <path>: response <status> has no content example (FR-171); contracts/asyncapi.yaml: missing top-level key asyncapi (FR-172); contracts/events.md, at the heading: event '<name>' has no <field>: line (FR-173); contracts/schema.sql: schema.sql does not parse (<dialect>|default dialect): <first line> | table <t> has no COMMENT ON TABLE or OPTIONS(description=...) | column <t>.<c> has no COMMENT ON COLUMN or OPTIONS(description=...) (FR-174); contracts/errors.yaml: error code <repr> must match ^[A-Z][A-Z0-9_]*$ | <code>: must be a mapping with meaning, when, status, message, log_level, retryable, metric | <code>: missing <key> | <code>: status must be an integer | <code>: retryable must be true or false (FR-175); contracts/permissions.yaml: roles must be a mapping of role to {identity} | role <r>: missing identity | role <r>: missing secret | operations must be a mapping of operation to {allow, deny} | operation <op>: must be a mapping with allow and deny lists | operation <op>: <allow|deny> must be a list | operation <op>: role <r> must appear in exactly one of allow and deny (found <n>) | operation <op>: unknown role <r> (FR-176); row_rules must be a list | row_rules item <i> must be a mapping | row_rules item <i>: missing <key> (FR-177); contracts/config.yaml: settings must be a mapping of name to {type, default, environments, owner} | setting <name>: must be a mapping | setting <name>: missing <key> | setting <name>: environments must be a mapping (FR-178); contracts/data-classification.yaml: tables must be a mapping | table <t>: must be a mapping | table <t>: missing <key> | table <t>: columns must be a mapping of column to class | <t>.<c>: class <repr> must be public, internal, confidential or pii | masking must be a mapping with logs, errors and fixtures | masking: missing <key> (FR-179); contracts/dependencies/<svc>.yaml: missing <key> | auth must be a mapping with secret | failures must be a mapping with timeout, 4xx, 5xx and outage | failures: missing <key> (FR-180); prd.md, at the section 7 row: custom type <type>: no named pack declares contract type <type> | custom type <type>: glob matches no file | custom type <type>: file <path> is outside the PRD folder (FR-181); custom type <type>: validator does not parse: <reason> | custom type <type>: validator not found: <word> | custom type <type>: validator not executable: <word> | custom type <type>: validator timed out after <t>s | custom type <type>: validator failed: <line> | custom type <type>: validator cannot run: <word>: <reason> (FR-182)"
    schema-refs: "any .md file but errors.md, at the line: `<t>.<c>`: table <t> has no column <c> (FR-183)"
    error-codes: "at the citation (the Errors: line, the x-error-codes line, the failures entry): error code <code> is not in contracts/errors.yaml (FR-184); contracts/errors.yaml, at the code: error code <code> is catalogued but cited nowhere (FR-185)"
prd_publish:
  # Only what lint-cli's FR-010 needs so far; the publish area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_publish.py <arguments>"
  output:
    missing_package: "stderr: prd_publish: missing Python package '<package>'. Run with: uv run --script prd_publish.py …, or: pip install pyyaml sqlglot openapi-spec-validator markdown-it-py (FR-010)"
  exit_codes:
    2: "missing dependency (FR-010)"
prd_status:
  invocation: "uv run --script prd-toolkit/scripts/prd_status.py [--json] [--interface] [prd_dir]; through the launcher, prd status"
  arguments:
    "prd_dir": "the PRD folder; required unless --interface is given (FR-222)"
    "--json": "print one JSON document instead of the text report; --json=1 is the same, any other --json=N is refused (FR-222, FR-041)"
    "--interface": "print the interface number 1; the folder is not read and a --json=N is not checked (FR-222)"
    "-h, --help": "print the help to stdout"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-040)"
  next_text_line: "stdout, text: <n>. <text>, one line per Next item after the line ## Next and one empty line, <n> counting from 1 (FR-040)"
  next_run_line: "stdout, text: two spaces, run: and the item's command, the line after an item that has a command (FR-040)"
  next_item:
    part: "string: Next (FR-041)"
    id: "string or null: the gate's ID for a gate item, the entry's ID for an error-open item, null for every other kind (FR-041)"
    text: "string: the item's sentence (FR-043 to FR-047)"
    kind: "string: one of next_kinds (FR-042)"
    ids: "list of strings: the IDs the item concerns, in the PRD's order; empty when none (FR-041)"
    area: "string or null: the area of a verify, build or adopt item or of an adoption gate (FR-041)"
    command: "string or null: the Claude Code command that does it, by its full name; for verify and build, /prd-toolkit:prd-build <area> and the block IDs, each after one space (FR-041, FR-045)"
    waits_on: "string or null: you, agent, or null for idle (FR-041)"
  next_kinds:
    - lint
    - deploy-stopped
    - error-open
    - gate
    - question
    - draft
    - deploy
    - verify
    - build
    - adopt
    - idle
  output:
    parts: "stdout, text: after the Next part, ## Header, ## Requirements, ## Areas, ## Adoption map, ## Not built, ## Not verified, ## Open errors, ## Upstreams, ## Consumers, ## Change sets, ## CI, ## Deployed, ## Matrix; each the heading, one empty line and its lines, one empty line between parts (FR-223)"
    none_line: "stdout, text: None., the one line of a part with nothing to list (FR-223)"
    header: "PRD: <folder> / version <version or -> / status <status or -> (FR-224)"
    requirements_line: "<area>: <status> <n>, <status> <n>, statuses sorted, areas in file order, nfr last (FR-225)"
    areas_line: "<area>: pack <name> <version or (default)>, output language <code> (FR-226)"
    adoption_line: "<area> | <state> | <globs joined by ', ' or -> ; or Not applicable: new project (FR-227)"
    block_line: "<ID> <title> (<file>), in Not built (approved) and Not verified (built) (FR-228)"
    open_error_line: "<E-id> <state>[ <class>] — <title> (FR-229)"
    upstream_line: "<name> <version or -> at <commit or ->, needs <needs or default>, then , check: not run (git URL; run prd_links.py check) | , check: error (<message>) | , check: <verdict> <n>, ... | , check: no items | nothing when unreachable (FR-230)"
    consumer_line: "<name> <location without backticks> (FR-230)"
    change_set_line: "<CS-id> <status>: <prd> <state>; <prd> <state> (FR-231)"
    ci_line: "the stale lines of prd_hooks.py check --ci (AC-111.1, AC-111.2, AC-068.5), or <folder> is not inside a git checkout (FR-232)"
    deployed_line: "<env>: <version> at <commit>, <date> | <env>: run <run id> stopped (unfinished|failed|human) at step <N> (FR-233)"
    matrix_line: "<ID>: <T-id> <level> <gate or -> cited|missing; ... | <ID>: no tests (FR-234)"
    json_item: "stdout, --json: each item after the Next items is {part, id, text}, id as FR-223 gives it (FR-223, FR-041)"
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "status", "error": <message>} (FR-222, FR-040)'
    interface: "stdout, --interface: 1 (FR-222)"
    usage: "stderr: usage: prd_status.py [-h] [--json] [--interface] [prd_dir] (FR-222)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_status: unsupported interface <N>; this toolkit speaks 1 (FR-222)"
    not_a_prd: "stderr: prd_status: <resolved folder>: no prd.md (FR-222)"
    unmigrated: "stderr: prd_status: <folder>/prd.md: section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; move the table there and leave \"See adoption.md.\" (FR-222)"
    internal_error: "stderr: prd_status: internal error: <exception type>: <message> (FR-040)"
  exit_codes:
    0: "the report, --interface or --help"
    2: "usage error, an unsupported --json=N without --interface, a folder without prd.md, an unmigrated 0.2 PRD, or an internal error"
prd_block:
  invocation: "uv run --script prd-toolkit/scripts/prd_block.py [--claude-md CLAUDE_MD] [--check] prd_dir; the vendored .prd-toolkit/prd_block.py takes the same arguments"
  arguments:
    "prd_dir": "the PRD folder (FR-245)"
    "--claude-md CLAUDE_MD": "write the block in this file instead of CLAUDE.md at the repository root (FR-246)"
    "--check": "write nothing; name each stale target file (FR-240)"
    "-h, --help": "print the help to stdout"
  files:
    claude_md: "CLAUDE.md at the repository root, or --claude-md: the block at the end (FR-235, FR-236, FR-237, FR-246)"
    prd_readme: "<prd folder>/README.md: the block at the top (FR-237, FR-241)"
    parent_readme: "<parent>/README.md, only when the parent is named prd: the block at the top (FR-237, FR-242, FR-243)"
    markers: "<!-- prd-toolkit:start --> and <!-- prd-toolkit:end -->, whole lines outside closed code fences (FR-238)"
  output:
    stale: "stdout, --check: stale: <file>, one per stale target, CLAUDE.md first, then the PRD README, then the parent README (FR-240)"
    sibling_unreadable: "stderr: prd_block: <folder name>: could not be read (<exception type>: <message>) (FR-242)"
    more_than_one: "stderr: prd_block: <file>: more than one prd-toolkit block (FR-238)"
    unbalanced: "stderr: prd_block: <file>: prd-toolkit start and end markers are unbalanced (FR-238)"
    marker_in_summary: "stderr: prd_block: prd.md §2 holds a prd-toolkit marker (FR-244)"
    not_a_prd: "stderr: prd_block: <resolved folder>: no prd.md (FR-245)"
    unmigrated: "stderr: prd_block: <folder>/prd.md: section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; move the table there and leave \"See adoption.md.\" (FR-245)"
    usage: "stderr: usage: prd_block.py [-h] [--claude-md CLAUDE_MD] [--check] prd_dir, then prd_block.py: error: <argparse message> (FR-245)"
    internal_error: "stderr: prd_block: internal error: <exception type>: <message>"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script"
  exit_codes:
    0: "every block written or already current; --check with nothing stale; --help"
    1: "--check found a stale or missing block (FR-240)"
    2: "usage error, a folder without prd.md, an unmigrated 0.2 PRD, a broken marker, a marker in §2, or an internal error (FR-238, FR-244, FR-245)"
prd_help:
  invocation: "uv run --script prd-toolkit/scripts/prd_help.py [--key KEY | --rule RULE] [--json] [--interface]; through the launcher, prd help"
  arguments:
    --key KEY: "print the catalogue entry with that key (FR-034); with --json, limit entries to it (FR-035)"
    --rule RULE: "print that lint rule and the entries it checks (FR-034); with --json, limit rules to it and entries to those that name it (FR-035)"
    --json: "print one JSON document instead of text; --json=1 is the same, any other --json=N is refused (FR-035, FR-036)"
    --interface: "print the interface number 1; the catalogue is not read and a --json=N is not checked (FR-035)"
    "-h, --help": "print the help to stdout"
  output:
    index_entry: "stdout, no option: <key>, two spaces, <name>, one line per entry in the catalogue's order (FR-033)"
    index_rule: "stdout, no option, after one empty line: <name>, two spaces, <severity>, one line per rule sorted by name (FR-033)"
    entry_text: "stdout, --key: <name> (<key>) / What: <what> / Why: <why> / Rules: and - <rule> lines / Checked by: and - <rule name>: <description> lines / See: <see>; a part the entry lacks prints no line (FR-034)"
    rule_text: "stdout, --rule: <name> (<severity>) / <description> / Checks: <key>, <key> when an entry names the rule (FR-034)"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "help", "entries": [{"key", "name", "what", "why", "rules", "checked_by", "see"}], "rules": {<name>: {"severity", "description"}}}; rules, checked_by and see only when the entry has them (FR-035)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "help", "error": <message>} (FR-036)'
    interface: "stdout, --interface: 1 (FR-035)"
    no_entry: "stderr: prd_help: no entry '<key>' (FR-036)"
    no_rule: "stderr: prd_help: no rule '<rule>' (FR-036)"
    bad_catalogue: "stderr: prd_help: <path>: <reason>, the reasons listed in AC-036.3 (FR-036)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_help: unsupported interface <N>; this toolkit speaks 1 (FR-036)"
    usage: "stderr: usage: prd_help.py [-h] [--key KEY | --rule RULE] [--json] [--interface], one line whatever the terminal width (FR-036)"
    argparse_error: "stderr: usage line, then prd_help.py: error: <argparse message> (FR-036)"
  keys:
    - kind.UJ
    - kind.FR
    - kind.NFR
    - kind.T
    - kind.E
