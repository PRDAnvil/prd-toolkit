    prd-trace: "sh .prd-toolkit/prd trace <q> --range <range>; range $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD on GitLab, ${{ github.event.pull_request.base.sha }}..HEAD on GitHub (FR-114, FR-116, FR-117)"
    test-<level>: "the build-gate level's Harness command (FR-114)"
    drift-<env>: "manual: sh .prd-toolkit/prd drift <q> --env <env> (FR-115)"
    test-deploy-<env>: "manual: export PRD_ENV=<env> TEST_ENV=<env>; <harness command>, one per level (FR-115)"
    secrets_line: "line 2 with a manual job and named secrets: # Manual jobs may need these secrets (operations.md Secrets): <names> (FR-118)"
