    bad_commit: "stderr: prd_error: commit must be 7 to 40 lowercase hex digits; got '<value>' (FR-080)"
    refused: "stderr, errors.md unchanged: refused: <E-id> is not an entry | refused: <E-id> is already resolved | refused: <E-id> is not confirmed | refused: <E-id> is classed <class>; a red run resolves a code bug only | refused: <level> is not a level of testing.md | refused: <level> is a deploy-gate level | refused: <level> has no One test command; add the One test column to testing.md Levels through /prd-toolkit:prd-change | refused: the test id must hold no white space and must not start with - | refused: the PRD has no adoption map, so every path is covered; resolve with a regression T-id | refused: <sha> changes <path>, which area <area> covers; resolve with a regression T-id | refused: <a replay finding>, one line per finding (FR-080)"
