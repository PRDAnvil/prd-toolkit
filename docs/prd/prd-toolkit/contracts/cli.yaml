# The custom contract type `cli` (prd.md §7): one top-level key per CLI script, each with its
# arguments, its output lines and its exit codes. Test cases target a script as `cli:<key>`.
prd_lint:
  invocation: "uv run --script prd-toolkit/scripts/prd_lint.py [--list-rules] [--list-packs] [--ci] [--sample-tids N] [--json] [--interface] [prd_dir]"
  arguments:
    "prd_dir": "the PRD folder; required unless --list-rules, --list-packs or --interface is given (FR-004)"
    "--list-rules": "print every registered rule and its severity, sorted, one per line; the folder is not read (FR-003)"
    "--list-packs": "print every pack on this machine, the toolkit's own first; the folder is not read (FR-013)"
    "--ci": "set PRD_LINT_CI=1 before the rules run (FR-008)"
    "--sample-tids N": "integer >= 0; print up to N random non-unit test cases instead of linting (FR-007)"
    "--json": "print the lint result as one JSON document instead of the finding lines; --json=1 is the same, any other --json=N is refused (FR-014)"
    "--interface": "print the interface number 1; the folder is not read and a --json=N is not checked (FR-014)"
    "-h, --help": "print the help to stdout (FR-004)"
  output:
    finding: "stdout: <path>:<line>: <rule>: <message>, sorted by file, line, rule; <path> per FR-002"
    warn_finding: "stdout: <path>:<line>: warn: <rule>: <message>, sorted with the findings (FR-001)"
    rule_name: "stdout, --list-rules: <name> <severity> per line, the severity error or warn"
    pack: "stdout, --list-packs: <name> <version> (<source>), then ' — <description>' when the pack has one (FR-013)"
    vendored_note: "stderr, --list-packs from a vendored copy: prd_lint: listed from the vendored copy: <names> is/are vendored in .prd-toolkit/packs/, each with the source it was vendored from; the plugin's own scripts/prd_lint.py --list-packs lists every pack on this machine (FR-013)"
    sample: "stdout, --sample-tids: <T-id> <test-case file relative to the folder>"
    usage: "stderr: usage: prd_lint.py [-h] [--list-rules] [--list-packs] [--ci] [--sample-tids N] [--json] [--interface] [prd_dir], one line whatever the terminal width"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "lint", "prd", "version", "dir", "findings": [{"file", "line", "rule", "severity", "message"}], "errors", "warnings"} (FR-014)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "lint", "error": <message>} (FR-014)'
    interface: "stdout, --interface: 1 (FR-014)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_lint: unsupported interface <N>; this toolkit speaks 1 (FR-014)"
    argparse_error: "stderr: usage line, then prd_lint.py: error: <argparse message>"
    negative_sample: "stderr: prd_lint: --sample-tids N must be >= 0"
    not_a_prd: "stderr: prd_lint: <resolved folder>: no prd.md, optionally followed by ; found <name>; the file name is lowercase prd.md"
    internal_error: "stderr: prd_lint: internal error: <exception type>: <message>"
    rule_crash: "stderr: prd_lint: internal error in rule <rule>: <exception type>: <message>"
    no_sample: "stderr: prd_lint: no non-unit T-ids to sample"
    missing_package: "stderr: prd_lint: missing Python package '<package>'. Run with: uv run --script <script> …, or: pip install pyyaml sqlglot openapi-spec-validator"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-009)"
  exit_codes:
    0: "clean lint or only warnings, --list-rules, --list-packs, --interface, --help, or a sample printed"
    1: "one or more error findings, or --sample-tids with no non-unit test case"
    2: "usage error, an unsupported --json=N without --interface, folder without prd.md, missing dependency, or internal error (load or rule)"
  structure_findings:
    frontmatter: "prd.md: missing key '<key>' | '<key>: <value>' <reason> | missing key 'sql-dialect' (required because contracts/schema.sql exists) | 'sql-dialect: <value>' is not a sqlglot dialect (<sqlglot error>) (FR-020)"
    language-table: "prd.md: language '<code>' has no table, or the language loader's reason (FR-021)"
    sections_headings: "prd.md: missing section '## <n>. <title>' | sections are out of order | unexpected section '## <n>. <title>' (FR-022)"
    sections_files: "<entry>:0 mandatory '<entry>' is missing | mandatory '<entry>' cannot be marked not applicable | '<slot>' is absent and section 1 has no 'Not applicable: `<slot>` — reason' line (FR-023)"
    sections_adoption: "section 8: the adoption map moved to adoption.md in prd-toolkit 0.3; ... | section 8 points at adoption.md but adoption.md does not exist | section 8 says \"Not applicable: new project\" but adoption.md exists | section 8 body must be \"See adoption.md.\" or \"Not applicable: new project.\" | adoption.md holds no '| Area | State | Boundary |' table | adoption.md table header must be '| Area | State | Boundary |', not '| <cells> |' | adoption state '<state>' for <area> must be one of not started, extracted, confirmed, adopted (FR-024)"
    sections_harness: "testing.md has no '## Harness' section with its slots | Harness slot '<slot>' is missing | Harness slots are out of order; the order is <the fifteen slots> | the Harness Layout slot has no 'Test roots:' text | Test roots: lists no backticked directory (FR-025)"
    placeholder: "placeholder '<text>' in prose; if this is literal text, put it in backticks | placeholder '<text>' in a YAML value (FR-027)"
    vague-word: "'<word>' with no measurable number on the line (FR-028)"
    markers-open: "the clarification marker's name in square brackets, then: left open while status is <status> (markers count in every text file, comments included; delete a template hint once its slot is answered) (FR-029)"
    assumption-indexed: "the word ASSUMPTION in square brackets, then: marker has no A-nn id | <A-id> has no row in section 12 | <A-id>: status '<status>' must be open, confirmed, corrected or awaiting <who> | <A-id> is open while the PRD is Approved (FR-030)"
    open-questions-empty: "section 13 must be 'None.' when the PRD is Approved (FR-031)"
    glossary-synonym: "'<text>' is a banned synonym; use '<term>' (FR-032)"
prd_publish:
  # Only what lint-cli's FR-010 needs so far; the publish area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_publish.py <arguments>"
  output:
    missing_package: "stderr: prd_publish: missing Python package '<package>'. Run with: uv run --script prd_publish.py …, or: pip install pyyaml sqlglot openapi-spec-validator markdown-it-py (FR-010)"
  exit_codes:
    2: "missing dependency (FR-010)"
prd_status:
  # Only what the status-next area needs so far; the status area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_status.py [--json] [--interface] [prd_dir]; through the launcher, prd status"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-040)"
  next_text_line: "stdout, text: <n>. <text>, one line per Next item after the line ## Next and one empty line, <n> counting from 1 (FR-040)"
  next_run_line: "stdout, text: two spaces, run: and the item's command, the line after an item that has a command (FR-040)"
  next_item:
    part: "string: Next (FR-041)"
    id: "string or null: the gate's ID for a gate item, the entry's ID for an error-open item, null for every other kind (FR-041)"
    text: "string: the item's sentence (FR-043 to FR-047)"
    kind: "string: one of next_kinds (FR-042)"
    ids: "list of strings: the IDs the item concerns, in the PRD's order; empty when none (FR-041)"
    area: "string or null: the area of a verify, build or adopt item or of an adoption gate (FR-041)"
    command: "string or null: the Claude Code command that does it, by its full name; for verify and build, /prd-toolkit:prd-build <area> and the block IDs, each after one space (FR-041, FR-045)"
    waits_on: "string or null: you, agent, or null for idle (FR-041)"
  next_kinds:
    - lint
    - deploy-stopped
    - error-open
    - gate
    - question
    - draft
    - deploy
    - verify
    - build
    - adopt
    - idle
prd_help:
  invocation: "uv run --script prd-toolkit/scripts/prd_help.py [--key KEY | --rule RULE] [--json] [--interface]; through the launcher, prd help"
  arguments:
    --key KEY: "print the catalogue entry with that key (FR-034); with --json, limit entries to it (FR-035)"
    --rule RULE: "print that lint rule and the entries it checks (FR-034); with --json, limit rules to it and entries to those that name it (FR-035)"
    --json: "print one JSON document instead of text; --json=1 is the same, any other --json=N is refused (FR-035, FR-036)"
    --interface: "print the interface number 1; the catalogue is not read and a --json=N is not checked (FR-035)"
    "-h, --help": "print the help to stdout"
  output:
    index_entry: "stdout, no option: <key>, two spaces, <name>, one line per entry in the catalogue's order (FR-033)"
    index_rule: "stdout, no option, after one empty line: <name>, two spaces, <severity>, one line per rule sorted by name (FR-033)"
    entry_text: "stdout, --key: <name> (<key>) / What: <what> / Why: <why> / Rules: and - <rule> lines / Checked by: and - <rule name>: <description> lines / See: <see>; a part the entry lacks prints no line (FR-034)"
    rule_text: "stdout, --rule: <name> (<severity>) / <description> / Checks: <key>, <key> when an entry names the rule (FR-034)"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "help", "entries": [{"key", "name", "what", "why", "rules", "checked_by", "see"}], "rules": {<name>: {"severity", "description"}}}; rules, checked_by and see only when the entry has them (FR-035)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "help", "error": <message>} (FR-036)'
    interface: "stdout, --interface: 1 (FR-035)"
    no_entry: "stderr: prd_help: no entry '<key>' (FR-036)"
    no_rule: "stderr: prd_help: no rule '<rule>' (FR-036)"
    bad_catalogue: "stderr: prd_help: <path>: <reason>, the reasons listed in AC-036.3 (FR-036)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_help: unsupported interface <N>; this toolkit speaks 1 (FR-036)"
    usage: "stderr: usage: prd_help.py [-h] [--key KEY | --rule RULE] [--json] [--interface], one line whatever the terminal width (FR-036)"
    argparse_error: "stderr: usage line, then prd_help.py: error: <argparse message> (FR-036)"
  keys:
    - kind.UJ
    - kind.FR
    - kind.NFR
    - kind.T
    - kind.E
    - kind.CS
    - kind.S
    - kind.P
    - block.title
    - block.status
    - block.flow
    - block.acceptance
    - block.ac
    - block.errors
    - block.edge_cases
    - block.tests
    - block.traces
    - block.source
    - case.ac
    - case.level
    - case.target
    - case.environment
    - case.identity
    - case.preconditions
    - case.input
    - case.expect
    - case.expect.output
    - case.expect.effects
    - case.expect.errors
    - case.expect.leaks
    - case.rubric
    - case.threshold
    - case.runs
    - case.steps
    - case.signoff
    - case.known_failing
    - case.symptom
    - case.refs
    - table.glossary
    - table.standards
    - table.skills
    - table.index
    - table.assumptions
    - marker.assumption
    - marker.needs_clarification
    - file.practices
    - table.sources
    - table.practices
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-035)"
  exit_codes:
    0: "the index, an entry, a rule, the JSON document, --interface or --help"
    2: "an unknown key or rule, a usage error, an unsupported --json=N without --interface, or a catalogue that cannot be used (FR-036)"
prd_practices:
  invocation: "uv run --script prd-toolkit/scripts/prd_practices.py [--paths PATH [PATH ...]] [--json] [--interface] prd_dir; through the launcher, prd practices"
  arguments:
    prd_dir: "the PRD folder; required unless --interface is given; it comes before --paths, which takes every argument after it (FR-050, FR-052)"
    --paths PATH [PATH ...]: "print only the code practices whose glob matches one or more of the paths, each path relative to the repository root, as written (FR-050); with --json, limit practices to them (FR-051)"
    --json: "print one JSON document instead of text; --json=1 is the same, any other --json=N is refused (FR-051, FR-052)"
    --interface: "print the interface number 1; the folder is not read and a --json=N is not checked (FR-051)"
    "-h, --help": "print the help to stdout"
  output:
    source_line: "stdout: <id> (<decision>, read <read>): <title>, <location>; covers <covers>, one line per source in the table's order (FR-050)"
    practice_line: "stdout: <id> (<source>, <applies to>, <glob>): <practice>, one line per practice in the table's order, after the source lines; with --paths, only the matching code practices and no source line (FR-050)"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "practices", "sources": [{"id", "title", "location", "covers", "read", "decision", "line"}], "practices": [{"id", "source", "glob", "applies_to", "practice", "line"}]}; each value a string but line, a number (FR-051)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "practices", "error": <message>} (FR-052)'
    interface: "stdout, --interface: 1 (FR-051)"
    not_a_prd: "stderr: prd_practices: <resolved folder>: no prd.md, optionally followed by ; found <name>; the file name is lowercase prd.md (FR-052)"
    internal_error: "stderr: prd_practices: internal error: <exception type>: <message> (FR-052)"
    usage: "stderr: usage: prd_practices.py [-h] [--paths PATH [PATH ...]] [--json] [--interface] prd_dir, one line whatever the terminal width (FR-052)"
    argparse_error: "stderr: usage line, then prd_practices.py: error: <argparse message> (FR-052)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_practices: unsupported interface <N>; this toolkit speaks 1 (FR-052)"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-051)"
  lint_findings:
    # What prd lint (prd_lint, AC-001.2's finding line) prints for the rule practices (FR-049), on a PRD folder that
    # holds practices.md; each at its row's line, in practices.md unless the item says prd.md.
    id_form: "practices.md: source ID '<id>' is not S- and two digits | practice ID '<id>' is not P- and two digits (FR-049)"
    id_unique: "practices.md: <id> is already defined at practices.md:<line> (FR-049)"
    decision: "practices.md: source <id>: Decision '<decision>' is not one of approved, declined, proposed (FR-049)"
    proposed_on_approved: "practices.md: source <id> is still 'proposed' but the PRD is Approved (FR-049)"
    practice_source: "practices.md: practice <id>: source '<source>' is not in the Sources table | practice <id>: source <source> is '<decision>', not approved (FR-049)"
    applies_to: "practices.md: practice <id>: Applies to '<value>' is not code or prd (FR-049)"
    code_glob: "practices.md: practice <id>: a code practice needs a glob in Object (glob) (FR-049)"
    read_date: "practices.md: source <id>: Read '<read>' is not a date YYYY-MM-DD (FR-049)"
    standards_source: "prd.md: standards row names <S-id>, which is not in practices.md | standards row names <S-id>, which is '<decision>' in practices.md, not approved (FR-049)"
  exit_codes:
    0: "the listing, printed or empty, the JSON document, --interface or --help"
    2: "a usage error, an unsupported --json=N without --interface, a folder without prd.md, or an internal error (FR-052)"
prd_change:
  # Only what the practices area needs so far; the change area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_change.py ids next <prd_dir> <kind> [--json]; through the launcher, prd change ids next"
  kinds: "FR, NFR, UJ, S (the next source ID, FR-054), P (the next practice ID, FR-054), AC-<nnn> or T-<nnn>"
  output:
    next_id: "stdout: the next free ID of the kind, one line (FR-054)"
    json_document: 'stdout, --json: one line, {"interface": 1, "kind": "change.ids", "next": <the ID>} (FR-054)'
    unknown_kind: "stderr: refused: unknown kind <kind>; use FR, NFR, UJ, S, P, AC-<nnn> or T-<nnn> (FR-054)"
  exit_codes:
    0: "the next ID printed"
    1: "an unknown kind (FR-054)"
prd_change_pack_lift:
  # The --lift form of prd_change.py pack (pack-authoring); the version move without --lift is the change area's.
  invocation: "uv run --script prd-toolkit/scripts/prd_change.py pack <prd_dir> <name> <X.Y.Z> --lift [--source SOURCE] [--json]; through the launcher, prd change pack … --lift (FR-060)"
  arguments:
    --lift: "move a PRD that names no pack onto a pack declaring its own custom contract types (FR-060)"
    --source SOURCE: "with --lift: take the pack from that source when more than one holds the name and version (FR-060)"
  output:
    lift_lines: "stdout: <version>, then the row | <version> | <YYYY-MM-DD> | pack <name> <X.Y.Z> lifted; pending | - | (FR-060)"
    lift_json: 'stdout, --json: one line, {"interface": 1, "kind": "change.pack", "version": <version>, "row": <row>} (FR-060)'
    lift_writes: "prd.md: the line - Pack: <name> <X.Y.Z> (<source>) after section 1's last bullet; the Validator cell pack in each section 7 custom row of a type the pack declares; version, updated (the local date) and the section 14 row as a patch record; nothing staged or committed, so git status --porcelain lists  M <prd.md's path> (FR-060)"
    names_pack: "stderr: refused: the PRD already names pack <name> at <file>:<line>; a lift moves a PRD that names none (FR-060)"
    not_found: "stderr: refused: no pack <name> <X.Y.Z> is on this machine; prd lint --list-packs lists the packs it finds, or with --source refused: no pack <name> <X.Y.Z> (<source>) is on this machine; prd lint --list-packs lists the packs it finds (FR-060)"
    more_than_one: "stderr: refused: pack <name> <X.Y.Z> comes from more than one source: <source>, <source>; name one with --source <source> (FR-060)"
    no_types: "stderr: refused: pack <name> <X.Y.Z> declares no contract type; a lift moves a PRD onto a pack that declares its custom types (FR-060)"
    not_custom: "stderr: refused: contract type <type> of pack <name> is not a custom row of section 7 (FR-060)"
    glob: "stderr: refused: contract type <type>: section 7 has <cell>, pack <name> has <files> (FR-060)"
    dirty: "stderr: refused: <PRD folder from the repository root> has uncommitted changes; commit or set them aside first (FR-060, the version move's line)"
    bad_version: "stderr: pack: <X.Y.Z> is not a version X.Y.Z (FR-060, the version move's line)"
    source_without_lift: "stderr: pack: --source belongs to --lift (FR-060)"
  exit_codes:
    0: "the lift written and recorded"
    1: "the lift refused (FR-060)"
    2: "a version not X.Y.Z, or --source without --lift (FR-060)"
prd_context_profile:
  # What the implement context pack prints that names an area's pack (pack-authoring, AC-060.7): the line forms a lift changes.
  # The rest of prd_context is the context area's, and these lines are printed as before.
  invocation: "uv run --script prd-toolkit/scripts/prd_context.py <prd_dir> --area <area> --for implement; through the launcher, prd context"
  part: "stdout: a part is its title line ## <part> and the lines after it up to, not including, the next line that starts with ## ; the pack starts with the part ## Header, then ## Stack (AC-060.7)"
  header_version_line: "stdout, the Header part's third line: PRD: <prd_dir as given> version <version> mode implement (AC-060.7)"
  header_profile_line: "stdout, the Header part: Target: pack <name> <X.Y.Z> (<source>), output language <code>, or Target: pack <name> (default), output language <code> for an area that names no pack (AC-060.7)"
  header_size_line: "stdout, the Header part's last line: pack <n> bytes (~<k>k tokens, bytes / 4); prd.md <n>; features/<area>.md <n>, each <n> a number with a comma between thousands (AC-060.7)"
  stack_pack_line: "stdout, the Stack part: section 1 of prd.md as written, so a Pack: line shows as - Pack: <name> <X.Y.Z> (<source>) where section 1 holds it (AC-060.7)"
  harness_defaults_part: "stdout, when the area's pack has a harness: the line ## Harness defaults, one empty line, one line - **<slot>.** <text> per slot in the pack's order, and one empty line, directly after the Levels part, before any Rubric conventions part and the Cited part (AC-060.7)"
prd_pack:
  invocation: "uv run --script prd-toolkit/scripts/prd_pack.py compare <prd_a> <prd_b> [--json] | check <pack_dir> <prd_a> <prd_b> [--json] | --interface; through the launcher, prd pack (FR-061)"
  arguments:
    compare: "two PRD folders, A first; prints what they share, part by part (FR-057, FR-058)"
    check: "a pack folder, then the two PRD folders it was written from (FR-059)"
    --json: "print one JSON document instead of text; --json=1 is the same, any other --json=N is refused (FR-058)"
    --interface: "print the interface number 1; no folder is read and a --json=N is not checked (FR-058)"
    "-h, --help": "print the help to stdout"
  output:
    part_title: "stdout, compare: ## <part>, for Contract types, Target kinds, Levels, Harness, Standards, Skills and Vocabulary, in that order; then the part's lines or None., then one empty line (FR-057)"
    contract_type_line: "stdout, compare: <mark> <type>: <files>; <validator> (FR-057)"
    target_kind_line: "stdout, compare: <mark> <type>: <a> in A, <b> in B (FR-057)"
    level_line: "stdout, compare: <mark> <level>: <command>; environment <environment>; gate <gate>; timeout <timeout>, an empty value written - (FR-057)"
    harness_line: "stdout, compare: <mark> <slot>: <text> (FR-057)"
    standard_line: "stdout, compare: <mark> <glob>: <linter> (FR-057)"
    skill_line: "stdout, compare: <mark> <activity>: <skill> (FR-057)"
    vocabulary_line: "stdout, compare: both <word>: <a> in A, <b> in B (FR-057)"
    mark: "both, A or B: both when the paired items are the same, A then B when they differ, A or B when one PRD holds the item (FR-057)"
    compare_json: 'stdout, compare --json: one line, {"interface": 1, "kind": "pack.compare", "a": <folder A>, "b": <folder B>, "parts": {"contract-types": [{"mark", "type", "files", "validator"}], "target-kinds": [{"mark", "type", "a", "b"}], "levels": [{"mark", "level", "command", "environment", "gate", "timeout"}], "harness": [{"mark", "slot", "text"}], "standards": [{"mark", "glob", "linter"}], "skills": [{"mark", "activity", "skill"}], "vocabulary": [{"mark", "word", "a", "b"}]}}; a count a number, a value the text writes - as null (FR-058)'
    nothing_shared: "stderr, compare: prd_pack: <folder A> and <folder B> share no custom contract type; there is no pack to write; with --json, stdout the error document with that message (FR-058)"
    finding: "stdout, check: <pack file or PRD file>: <what>, one per line, in the order of the checks (FR-059)"
    finding_manifest: "check: <pack dir>/pack.yaml: <the manifest loader's message> (FR-059)"
    finding_validator: "check: <prd dir>/prd.md: contract type <type>: glob matches no file | validator does not parse: <error> | validator not found: <program> | validator not executable: <program> | validator timed out after <N>s | validator failed: <line> (FR-059)"
    finding_pack_folder: "check: <prd dir>/prd.md: contract type <type>: validator fails from the pack folder: <line> (FR-059)"
    finding_no_sample: "check: <pack dir>/samples/<type>: no bad.* sample; add a file the validator must refuse (FR-059)"
    finding_sample_accepted: "check: <pack dir>/samples/<type>/<name>: the validator accepts it; a sample must be refused (FR-059)"
    finding_level: "check: <pack dir>/pack.yaml: levels[<i>] (<level>): <word> is not on PATH (FR-059)"
    check_json: 'stdout, check --json: one line, {"interface": 1, "kind": "pack.check", "findings": [{"file": <path>, "message": <what>}]} (FR-059)'
    json_error: 'stdout, --json on exit 2: one line, {"interface": 1, "kind": "pack.compare" | "pack.check" | "pack", "error": <message>} (FR-058)'
    interface: "stdout, --interface: 1 (FR-058)"
    not_a_prd: "stderr: prd_pack: <resolved folder>: no prd.md, optionally followed by ; found <name>; the file name is lowercase prd.md (FR-058)"
    internal_error: "stderr: prd_pack: internal error: <exception type>: <message> (FR-058)"
    usage: "stderr: argparse's usage text, its first line starting usage: prd_pack.py, then a line ending error: <argparse message> (FR-058)"
    unsupported_interface: "stderr, --json=N with N other than 1 and no --interface: prd_pack: unsupported interface <N>; this toolkit speaks 1 (FR-058)"
  encoding: "stdout and stderr are UTF-8 whatever the locale when run as a script (FR-058)"
  exit_codes:
    0: "the comparison printed, a clean check, --interface or --help"
    1: "compare: no shared custom contract type (FR-058); check: one or more findings (FR-059)"
    2: "a usage error, an unsupported --json=N without --interface, a PRD folder without prd.md, or an internal error (FR-058)"
prd_gates:
  # Only what the card-context area needs so far; the gates area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_gates.py list <prd_dir> [--worktrees] [--json]; through the launcher, prd gates list"
  output:
    list_line: "stdout, list: <id> <title>, one line per gate, as before this area: the areas and the URL are not printed (FR-067)"
    list_json: 'stdout, list --json: one line, {"interface": 1, "kind": "gates", "prd": <slug>, "gates": [{"id", "kind", "title", "question", "evidence", "choices", "source", …, "areas", "url"}]}; path and items only where the gate had them before, areas a list of strings and url a string or null on every gate (FR-062, FR-066, FR-067)'
    card: "the inbox card: the dict prdlint.gates.card(gate: Gate, prd: Prd, root: pathlib.Path, rel: str) returns and /gates serves, one per gate of list_gates(prd, root) in its order (kind: approval, error-class, deploy-step, adoption, signoff; then id); the gate's keys as list --json gives them, then its kind's keys, then waiting (FR-067)"
  card_keys:
    # Each card's keys, in order (FR-067). The gate's keys are id, kind, title, question, evidence, choices, source, then path
    # (with --worktrees, on an approval gate) and items (an adoption gate), then areas and url.
    approval: "the gate's keys, then restate, touches, bump, impact, dry_run, diff_truncated, diff, version, waiting"
    error-class: "the gate's keys, then class, diagnosis, waiting"
    deploy-step: "the gate's keys, then run, step, env, actor, do, check, waiting; for a run log that cannot be read, run, unreadable, waiting"
    adoption: "the gate's keys, then area (the area's name, a string, as before), waiting"
    signoff: "the gate's keys, then tid, owner, input, expect, waiting"
  gate_areas:
    error-class: "the areas of the blocks Touches: names, then of the owners of the cases known-failing on the entry (FR-062)"
    signoff: "the area of the test case's file (FR-062)"
    approval: "the areas of the blocks the verdict's touches name (FR-062)"
    adoption: "the area being adopted (FR-062)"
    deploy-step: "none (FR-062)"
  gate_url:
    error-class: "the entry's well-formed URL:, else its first area's URL (FR-066)"
    signoff: "its area's URL (FR-066)"
    adoption: "its area's URL (FR-066)"
    approval: "its area's URL when the change touches one area (FR-066)"
    deploy-step: "null (FR-066)"
  exit_codes:
    0: "the gates listed"
  # What the inbox-cards area needs: the decision inbox's listing and its answer, read in-process (FR-071).
  serve_invocation: "uv run --script prd-toolkit/scripts/prd_gates.py serve <prd_dir>; through the launcher, prd gates serve; in-process, server, token = prdlint.gates.make_inbox(prd_dir: pathlib.Path), server.server_close() releasing the inbox's lock file (FR-071)"
  listing: "the dict server.state.listing() returns and GET /gates serves: {\"prd\": <slug>, \"started\", \"worktrees\": [<group>, …], \"answers\"}; one group per worktree whose checkout holds the PRD folder, the inbox's own worktree first, then the others in git worktree list order; a group {\"path\": <the worktree's resolved absolute path>, \"branch\": <its branch, or HEAD when detached>, \"gates\": [<card>, …]}, or with \"gates\": [] and \"error\" when its PRD folder cannot be read; an error-class gate left out of a group when an earlier group holds its entry (FR-071)"
  inbox_answer: "the pair (status, result) server.state.answer(body) returns and POST /answer serves; body {\"worktree\": <a group's path>, \"gate\": <id>, \"question\": <the card's question>, \"choice\": \"confirm\" | \"correct\", \"words\": <text>, \"class\": <class, with correct>}; 200 and {\"gate\": <id>, \"result\": {\"stdout\": [<lines>], \"exit\": 0}} when the answer ran, committed in that worktree alone (FR-071)"
prd_error:
  # Only what the card-context area needs so far; the errors area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_error.py new <prd_dir> --title T --source S [--touches IDS] [--evidence-file F] [--url ADDRESS] | url <prd_dir> <E-id> <address or -> | list <prd_dir> [--open]; through the launcher, prd error"
  arguments:
    --url ADDRESS: "new: write the line URL: <address> after Touches:, or after Classification: with no Touches: (FR-064)"
    url: "set or replace the entry's URL: line; - removes it (FR-064)"
  output:
    new_id: "stdout, new: the new entry's ID, one line"
    summary_line: "stdout, url: <E-id> <state>, then  <class> when the class is not the state (FR-064)"
    list_line: "stdout, list: <E-id> <state>[ <class>] <touches or -> <title> (FR-063)"
    bad_url: "stderr: refused: URL: must start with http:// or https:// and hold no white space (FR-064)"
    no_entry: "stderr: refused: <E-id> is not an entry (FR-064)"
  lint_findings:
    url: "errors.md: <E-id>: URL: must start with http:// or https:// and hold no white space, rule error-entries (FR-063)"
    target_url: "features/<area>.md: Target: url must start with http:// or https:// and hold no white space, rule pack-resolves (FR-065)"
    target_grammar: "features/<area>.md: Target: must be one or more of pack <name> <X.Y.Z> (<source>), output language <code> and url <address>, comma-separated, in that order, rule pack-resolves (FR-065)"
  exit_codes:
    0: "the entry written or listed"
    1: "a write refused (FR-064)"
prd_git_hook:
  # Only what the standards-run area needs so far; the trace-and-hooks area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_git_hook.py pre-commit <prd_dir>; the installed pre-commit hook runs it through the vendored launcher"
  output:
    linter_failed: "stderr: prd-toolkit: `<command>` failed (exit <code>) on <paths joined by , >, then : and the linter's output on the next lines when it has any (FR-068)"
  exit_codes:
    0: "every enforced row passed, or had no staged path outside .prd-toolkit/ (FR-068)"
    1: "a linter failed (FR-068)"
prd_hooks:
  # Only what the standards-run area needs so far; the trace-and-hooks area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_hooks.py ci --github|--gitlab [--force] <prd_dir> | check --ci <prd_dir>"
  output:
    wrote: "stdout, ci: wrote <CI file>; for --gitlab also include: '<CI file>' (FR-068)"
    standards_job: "the job standards-<n>: git ls-files -z --format='./%(path)' -- <:(glob)<glob> quoted> ':(exclude).prd-toolkit' | xargs -0 -r <command> (FR-068)"
    stale_ci: "stdout, check --ci: stale: <CI file>: re-run prd_hooks.py ci --<forge> --force (FR-068)"
  exit_codes:
    0: "a CI file written, or check --ci found nothing stale"
    1: "check --ci found something stale (FR-068)"
  # What the hook-shims area needs: install and check of the toolkit's own hooks where core.hooksPath is set (FR-070).
  hooks_invocation: "uv run --script prd-toolkit/scripts/prd_hooks.py install <prd_dir> | check <prd_dir>; through the launcher, prd hooks install, prd hooks check (FR-070)"
  hook_written: "stdout, install: replaced <hooks>/<hook> (it used uv run --script) or installed <hooks>/<hook>, one line per hook written, commit-msg before pre-commit, <hooks> as git rev-parse --git-path hooks prints it; where core.hooksPath is set, for a hook file that is the toolkit's own (FR-070)"
  hook_left_alone: "stdout, install where core.hooksPath is set, for a hook that is absent or the user's own: core.hooksPath is set to <value>; no shim written; add this line to <hooks>/<hook> (an sh hook; place it before any `exit 0` in it): <line>, or ...; replace its uv run --script … prd_git_hook.py line in <hooks>/<hook> with this line: <line> (FR-070)"
  hook_stale: "stdout, check: stale: <hooks>/<hook>; run prd_hooks.py install, for a toolkit hook that is not the current shim; check exits 1 when it prints any line (FR-070)"
eval_scaffolds:
  # The start states the deploy and review eval cases build (eval-scaffolds, FR-073); not shipped behaviour of a prd command.
  invocation: "python3 -B prd-toolkit/evals/scaffolds/deploy_repo.py <dst> <ready|staging-done|failing-check|at-gate|at-ui-steps>; bash prd-toolkit/evals/review-edits-nothing/scaffold.sh, run in an empty folder"
  install_commit: "deploy_repo.py, every state: after Vendor the PRD toolkit, one commit Add the files install wrote (Refs: none (no behaviour change), dated 2026-01-05T13:00:00+0000) holding every file install left untracked; git status --porcelain then prints nothing (FR-073)"
  output:
    run_line: "stdout, last line, states staging-done, at-gate and at-ui-steps: run=<id>"
  exit_codes:
    0: "the start state is built"
    other: "the build failed; the eval case does not run"
prd_launcher:
  # The sh launcher prd-toolkit/scripts/prd and its vendored copy .prd-toolkit/prd, the same file (launcher, FR-069).
  invocation: "prd-toolkit/scripts/prd <command> [arguments], or .prd-toolkit/prd <command> [arguments]; prd --version prints the toolkit's version"
  find: "first: uv python find --system \">=3.11\", its stderr not shown (FR-069)"
  run: "then exec: uv run --quiet --no-project --project <here> --python <the path the find printed, or >=3.11 when it exited other than 0 or printed nothing> --with-requirements <req> python <here>/prd_dispatch.py <command> [arguments] (FR-069)"
  output:
    no_uv: "stderr: prd: uv is not on PATH; install uv"
  exit_codes:
    2: "uv is not on PATH"
    other: "the exit code of the uv run line, which is the command's"
prd_context:
  # Only what the practices area needs so far; the context area adds the rest when it is adopted.
  invocation: "uv run --script prd-toolkit/scripts/prd_context.py [--area AREA] [--req ID[,ID...]] [--for {decide,implement}] [--context N] [--json] [--interface] [prd_dir]; through the launcher, prd context"
  implement_parts: "Header, Stack, Glossary, Requirements, Code, Practices, Levels, Harness defaults, Rubric conventions, Cited, Upstream contracts, Known defects, Open questions, History; a part with nothing to hold is left out or holds None. as before; Practices only when the PRD folder holds practices.md, holding None. when no code practice matches, and with no practices.md the pack is unchanged (FR-055)"
  practices_item: "text: <id> (<source>): <practice>, one item per matching code practice; JSON: a parts entry {\"title\": \"Practices\", \"id\", \"file\": \"practices.md\", \"line\", \"text\", \"stale\": false, \"counted\": true, \"moved\": null} (FR-055)"
  json_document: 'stdout, --json: one line, {"interface": 1, "kind": "context", "prd", "mode", "area", "ids", "parts": [<part entry>, …]}, the parts in the text pack''s order (FR-055)'
  area_notes_part: "with --area, in either mode: the part Area notes, directly before Requirements, when the area's features file holds area notes (features/context-notes.md); text: ## Area notes, an empty line, the notes' lines, an empty line; JSON: a parts entry {\"title\": \"Area notes\", \"id\": null, \"file\": \"features/<area>.md\", \"line\", \"text\", \"stale\": false, \"counted\": true, \"moved\": null}; with no area notes the pack is as before (FR-072)"
