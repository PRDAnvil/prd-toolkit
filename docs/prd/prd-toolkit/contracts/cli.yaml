    ci_flag: "stderr: prd_hooks: --ci belongs to check (FR-097)"
    argparse: "stderr: usage: prd_hooks.py [-h] [--gitlab] [--github] [--force] [--ci] {install,check,uninstall,ci,vendor} prd_dir, then prd_hooks.py: error: <argparse message> (FR-097)"
    not_a_prd: "stderr: prd_hooks: <resolved folder>: no prd.md (FR-097)"
    internal_error: "stderr: prd_hooks: internal error: <type>: <message> (FR-097)"
    outside_repo: "stderr: prd_hooks: <prd folder> is not inside the repository at <top> (FR-098)"
    not_a_checkout: "stderr, install, vendor and ci on a PRD folder outside a git checkout: prd_hooks: <prd folder> is not inside a git checkout (FR-098, FR-107, FR-113)"
    check_from_copy: "stderr, check without --ci from the vendored copy: prd_hooks: run check from the plugin, not the vendored copy (FR-108)"
  install_output:
