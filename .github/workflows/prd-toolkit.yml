name: prd-toolkit
on:
  pull_request:

permissions:
  contents: read

jobs:
  prd-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "sh .prd-toolkit/prd lint --ci docs/prd/prd-toolkit"
      - run: "sh .prd-toolkit/prd hooks check --ci docs/prd/prd-toolkit"

  prd-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "sh .prd-toolkit/prd trace docs/prd/prd-toolkit --range ${{ github.event.pull_request.base.sha }}..HEAD"

  standards-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "if [ -n \"$(git ls-files -- ':(glob)prd-toolkit/**' ':(exclude).prd-toolkit')\" ]; then npx -y @anthropic-ai/claude-code plugin validate ./prd-toolkit; fi"

  standards-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "if [ -n \"$(git ls-files -- ':(glob).claude-plugin/marketplace.json' ':(exclude).prd-toolkit')\" ]; then npx -y @anthropic-ai/claude-code plugin validate .; fi"

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "uv run --directory prd-toolkit pytest -q -n auto tests --ignore tests/prd"

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "uv run --directory prd-toolkit pytest -q -n auto tests/prd"
